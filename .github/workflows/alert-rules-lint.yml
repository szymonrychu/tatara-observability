name: alert-rules-lint

# Standalone "filter-or-justify" lint over alerts/*.yaml (see CONVENTIONS.md). Kills the
# recurring false-positive class where probe 5xx responses are counted as real HTTP errors.
# Complementary to, and deliberately NOT folded into, the terraform apply workflow: this
# check needs no AWS/Grafana secrets and is the false-POSITIVE guard (issue #18 is the
# false-negative / dark-rule guard).
#
# It also runs check_metric_provenance.py, which is the false-NEGATIVE guard and covers
# BOTH alerts/*.yaml and dashboards/*.json: an alert on a metric nobody emits reports OK
# forever, and a dashboard panel on one renders empty forever. Both read green while the
# thing they watch is dark.
#
# reconcile_metric_provenance.py (issue #57) closes the REMAINING hole: check_metric_
# provenance.py only validates alerts/dashboards against the allowlist, never the
# allowlist against reality. A metric removed from a producer repo's Go source stays on
# the allowlist forever unless someone happens to hand-reconcile it, so any rule still
# selecting it keeps reporting OK / rendering empty, undetected, indefinitely. This
# script shallow-clones the 4 producer repos at main and fails on any allowlist entry
# they no longer emit. A metric removal never touches this repo's paths-filtered
# triggers below, so it also runs on a nightly schedule.
#
# #100 added the third dimension to that same script. A PromQL selector has three
# (metric name, label name, label value) and the label NAME had never been guarded at
# all: five rules selected operator_task_terminal_total{stage=...} on a metric labelled
# {kind,state,stateReason} since v2.0.0 and both provenance guards reported OK. Both
# label dimensions are now derived per run from the clone this job already takes.

on:
  pull_request:
    paths:
      - "alerts/**"
      - "dashboards/**"
      - "scripts/lint_alert_rules.py"
      - "scripts/test_lint_alert_rules.py"
      - "scripts/check_alert_schema.py"
      - "scripts/test_check_alert_schema.py"
      - "modules/grafana_alert/variables.tf"
      - "scripts/check_metric_provenance.py"
      - "scripts/test_check_metric_provenance.py"
      - "scripts/reconcile_metric_provenance.py"
      - "scripts/test_reconcile_metric_provenance.py"
      - "scripts/metrics_allowlist.txt"
      - "scripts/label_exemptions.txt"
      - "scripts/check_runbook_urls.py"
      - "scripts/test_check_runbook_urls.py"
      - ".github/workflows/alert-rules-lint.yml"
  push:
    branches: [main]
    paths:
      - "alerts/**"
      - "dashboards/**"
      - "scripts/lint_alert_rules.py"
      - "scripts/test_lint_alert_rules.py"
      - "scripts/check_alert_schema.py"
      - "scripts/test_check_alert_schema.py"
      - "modules/grafana_alert/variables.tf"
      - "scripts/check_metric_provenance.py"
      - "scripts/test_check_metric_provenance.py"
      - "scripts/reconcile_metric_provenance.py"
      - "scripts/test_reconcile_metric_provenance.py"
      - "scripts/metrics_allowlist.txt"
      - "scripts/label_exemptions.txt"
      - "scripts/check_runbook_urls.py"
      - "scripts/test_check_runbook_urls.py"
      - ".github/workflows/alert-rules-lint.yml"
  schedule:
    # Nightly reverse-drift sweep: a metric removed from a producer repo never touches
    # this repo's paths above, so the PR/push triggers stay blind to it until someone
    # happens to edit an alert or dashboard. 03:23 UTC is an arbitrary off-peak minute,
    # not tied to any other schedule in this repo.
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install deps
        run: pip install --quiet pyyaml

      - name: linter self-tests
        run: python3 -m unittest discover scripts -p 'test_*.py' -v

      - name: lint alert rules
        run: python3 scripts/lint_alert_rules.py

      # The silent-drop guard. Terraform's object-type conversion DISCARDS any alert key
      # modules/grafana_alert/variables.tf does not declare - no error, no warning, no plan
      # diff - so a valid Grafana attribute in an alert file can pass every other check
      # here, merge, apply green, and do nothing. keep_firing_for was exactly that until
      # 2026-07-26, and one flapping rule minted three separate incident issues because of
      # it. This reads the schema out of variables.tf and fails on any key it does not
      # declare, so an attribute can never again be lost silently.
      - name: check alert keys against the module schema
        run: python3 scripts/check_alert_schema.py

      # Dimension 1 of 3: the metric NAME, against scripts/metrics_allowlist.txt. Covers
      # alerts/*.yaml AND dashboards/*.json. A dashboard panel on a deleted metric renders
      # empty, silently, forever, with no CI signal at all - the same silent-green failure
      # class as a dark alert rule, one surface over. Since #100 this script is NAME-only:
      # the label VALUE sweep it used to run moved into the step below, because it was a
      # membership test against a hand-maintained snapshot and the snapshot had rotted
      # across two contract versions without a single check going red.
      - name: check metric provenance (alerts + dashboards)
        run: python3 scripts/check_metric_provenance.py

      # Dimensions 2 and 3, plus the reverse direction of dimension 1. This shallow-clones
      # the 4 producer repos at main and derives, from the SAME Prometheus constructor call:
      # the metric names they emit (issue #57 - fails on any allowlist entry none of them
      # emit any more) and each metric's declared []string{...} label set (#100 - fails on
      # any alert/dashboard selector naming a label its emitting metric does not carry).
      # The closed-set label VALUES come off the operator CRD's +kubebuilder:validation:Enum=
      # markers in the same clone, so nothing about the label contract is copied into this
      # repo any more. Clone failures (network blip, GitHub outage) are a neutral skip inside
      # the script itself, never a hard failure here, and a metric whose constructor was not
      # located - or whose label slice was built from a variable - is excluded from both
      # label checks rather than guessed at.
      - name: reconcile metric provenance against producer repos
        run: python3 scripts/reconcile_metric_provenance.py

      # Issue #81: the incident skill's mandatory phase-2 "Runbook check" is a no-op unless
      # rules carry a runbook_url, and a runbook_url is worthless unless the anchor it names
      # actually exists on the docs page. This asserts both: every rule has the exact URL the
      # anchor contract derives from its own name (CONVENTIONS.md section 8), and - by
      # shallow-cloning tatara-documentation, same pattern as the step above - that
      # docs/operations/runbooks.md declares every one of those anchors. Clone failure is a
      # neutral skip inside the script; the local half still fails hard.
      - name: check runbook_url annotations resolve to real docs anchors
        run: python3 scripts/check_runbook_urls.py
