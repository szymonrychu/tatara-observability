name: alert-rules-lint

# Standalone "filter-or-justify" lint over alerts/*.yaml (see CONVENTIONS.md). Kills the
# recurring false-positive class where probe 5xx responses are counted as real HTTP errors.
# Complementary to, and deliberately NOT folded into, the terraform apply workflow: this
# check needs no AWS/Grafana secrets and is the false-POSITIVE guard (issue #18 is the
# false-negative / dark-rule guard).
#
# It also runs check_metric_provenance.py, which is the false-NEGATIVE guard and covers
# BOTH alerts/*.yaml and dashboards/*.json: an alert on a metric nobody emits reports OK
# forever, and a dashboard panel on one renders empty forever. Both read green while the
# thing they watch is dark.
#
# reconcile_metric_provenance.py (issue #57) closes the REMAINING hole: check_metric_
# provenance.py only validates alerts/dashboards against the allowlist, never the
# allowlist against reality. A metric removed from a producer repo's Go source stays on
# the allowlist forever unless someone happens to hand-reconcile it, so any rule still
# selecting it keeps reporting OK / rendering empty, undetected, indefinitely. This
# script shallow-clones the 4 producer repos at main and fails on any allowlist entry
# they no longer emit. A metric removal never touches this repo's paths-filtered
# triggers below, so it also runs on a nightly schedule.
#
# check_label_provenance.py (issue #100) closes the LAST dimension. All three checks
# above are about the metric NAME (plus four hard-coded label VALUES); nothing has
# ever validated a label NAME. A producer that renames a label while keeping the
# metric leaves every selector on the old name matching nothing, forever, with all
# three green. It derives the declared label set from the same clones and fails
# CLOSED - a repo it cannot clone is an error here, not a neutral skip.
#
# Every check above validates the SELECTOR. Issue #111 is the dimension after that:
# the COMPARISON. Two p95 rules thresholded a histogram_quantile above the largest
# value that quantile can return, so the selector was perfect, the metric was live,
# every label existed - and the rules were still mathematically unable to fire, on
# any input, ever. lint_alert_rules.py Check 4 range-checks every quantile threshold
# against scripts/histogram_bounds.txt, and reconcile_metric_provenance.py re-derives
# every bound in that file from the producer's own Buckets: expression on the same
# clones, hard-failing on drift so the ceiling file cannot go stale unnoticed. Check 5
# does the same for dashboards/*.json: the identical unreachable `30` was painted as a
# red threshold step on the two panels backing those rules, on a surface with no
# no_data_state to even mis-configure.
#
# check_chart_alert_parity.py (tatara-helmfile#440) is the dimension OUTSIDE this repo.
# Every check above validates a rule that exists here. None of them could see that
# tatara-operator's chart shipped 32 alerts of its OWN which this cluster's Prometheus
# never loaded, into an Alertmanager whose only receiver is named "null" - a whole second
# alerting plane, dark since the day it shipped, carrying 9 conditions with no rule here
# at all. That plane is now disabled (tatara-helmfile sets prometheusRule.enabled: false),
# 6 of the 9 are ported into alerts/ and 3 are waived against the rules that already
# replaced them. This script keeps the chart file and alerts/ reconciled from here on.

on:
  pull_request:
    paths:
      - "alerts/**"
      - "dashboards/**"
      - "scripts/lint_alert_rules.py"
      - "scripts/test_lint_alert_rules.py"
      - "scripts/check_alert_schema.py"
      - "scripts/test_check_alert_schema.py"
      - "modules/grafana_alert/variables.tf"
      - "scripts/check_metric_provenance.py"
      - "scripts/test_check_metric_provenance.py"
      - "scripts/reconcile_metric_provenance.py"
      - "scripts/test_reconcile_metric_provenance.py"
      - "scripts/check_label_provenance.py"
      - "scripts/test_check_label_provenance.py"
      - "scripts/metrics_allowlist.txt"
      - "scripts/stage_values_allowlist.txt"
      - "scripts/histogram_bounds.txt"
      - "scripts/check_runbook_urls.py"
      - "scripts/test_check_runbook_urls.py"
      - "scripts/check_chart_alert_parity.py"
      - "scripts/test_check_chart_alert_parity.py"
      - "scripts/chart_alert_waivers.txt"
      - ".github/workflows/alert-rules-lint.yml"
  push:
    branches: [main]
    paths:
      - "alerts/**"
      - "dashboards/**"
      - "scripts/lint_alert_rules.py"
      - "scripts/test_lint_alert_rules.py"
      - "scripts/check_alert_schema.py"
      - "scripts/test_check_alert_schema.py"
      - "modules/grafana_alert/variables.tf"
      - "scripts/check_metric_provenance.py"
      - "scripts/test_check_metric_provenance.py"
      - "scripts/reconcile_metric_provenance.py"
      - "scripts/test_reconcile_metric_provenance.py"
      - "scripts/check_label_provenance.py"
      - "scripts/test_check_label_provenance.py"
      - "scripts/metrics_allowlist.txt"
      - "scripts/stage_values_allowlist.txt"
      - "scripts/histogram_bounds.txt"
      - "scripts/check_runbook_urls.py"
      - "scripts/test_check_runbook_urls.py"
      - "scripts/check_chart_alert_parity.py"
      - "scripts/test_check_chart_alert_parity.py"
      - "scripts/chart_alert_waivers.txt"
      - ".github/workflows/alert-rules-lint.yml"
  schedule:
    # Nightly reverse-drift sweep: a metric removed from a producer repo never touches
    # this repo's paths above, so the PR/push triggers stay blind to it until someone
    # happens to edit an alert or dashboard. 03:23 UTC is an arbitrary off-peak minute,
    # not tied to any other schedule in this repo.
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install deps
        run: pip install --quiet pyyaml

      - name: linter self-tests
        run: python3 -m unittest discover scripts -p 'test_*.py' -v

      - name: lint alert rules and dashboard panels
        run: python3 scripts/lint_alert_rules.py

      # The silent-drop guard. Terraform's object-type conversion DISCARDS any alert key
      # modules/grafana_alert/variables.tf does not declare - no error, no warning, no plan
      # diff - so a valid Grafana attribute in an alert file can pass every other check
      # here, merge, apply green, and do nothing. keep_firing_for was exactly that until
      # 2026-07-26, and one flapping rule minted three separate incident issues because of
      # it. This reads the schema out of variables.tf and fails on any key it does not
      # declare, so an attribute can never again be lost silently.
      - name: check alert keys against the module schema
        run: python3 scripts/check_alert_schema.py

      # Covers alerts/*.yaml AND dashboards/*.json. A dashboard panel on a deleted metric
      # renders empty, silently, forever, with no CI signal at all - the same silent-green
      # failure class as a dark alert rule, one surface over.
      - name: check metric provenance (alerts + dashboards)
        run: python3 scripts/check_metric_provenance.py

      # Reverse-drift gate (issue #57): the check above only validates alerts/dashboards
      # against the allowlist. This validates the allowlist against the 4 producer repos'
      # live source, and fails on any entry none of them emit any more. Clone failures
      # (network blip, GitHub outage) are a neutral skip inside the script itself, never
      # a hard failure here.
      #
      # It also validates scripts/histogram_bounds.txt (#111) off the same clones: every
      # bucket ceiling Check 4 range-checks thresholds against is re-derived from the
      # producer's own Buckets: expression, and a mismatch is a hard failure. A stale
      # ceiling would make Check 4 reject a threshold that has become legal, which is a
      # red build on a correct rule - the way a check gets weakened to a warning.
      - name: reconcile metric provenance against producer repos
        run: python3 scripts/reconcile_metric_provenance.py

      # Label-NAME provenance (issue #100). The two checks above guard the metric
      # NAME and, via stage_values_allowlist.txt, four hard-coded label VALUES. The
      # third dimension of a PromQL selector - the label NAME - was never guarded at
      # all, and tatara-operator v2.0.0 renamed stage -> state while KEEPING
      # operator_task_terminal_total, so 5 rules selected a label that does not exist
      # on a metric that does. Name check green, value check green, 5 rules matching
      # nothing forever. This derives each metric's declared label set from the same
      # producer clones, from the `[]string{...}` closing argument of the same
      # constructor call the reconcile step already parses for the name, and fails on
      # any selector or `by (...)` clause naming a label the producer does not declare.
      # It FAILS CLOSED: a clone that never succeeds, a metric no producer declares,
      # or a label slice built from a variable is a failure here, not a skip - unlike
      # the neutral skip above, because "could not see" reported as OK is the exact
      # failure both this repo's earlier guards shipped with.
      - name: check label provenance (alerts + dashboards)
        run: python3 scripts/check_label_provenance.py

      # Issue #81: the incident skill's mandatory phase-2 "Runbook check" is a no-op unless
      # rules carry a runbook_url, and a runbook_url is worthless unless the anchor it names
      # actually exists on the docs page. This asserts both: every rule has the exact URL the
      # anchor contract derives from its own name (CONVENTIONS.md section 8), and - by
      # shallow-cloning tatara-documentation, same pattern as the step above - that
      # docs/operations/runbooks.md declares every one of those anchors. Clone failure is a
      # neutral skip inside the script; the local half still fails hard.
      #
      # TATARA_DOCS_REF makes a two-repo change checkable before either half merges: the
      # script clones docs `main` as it always did and UNIONS the branch's anchors on top,
      # never replacing them, so an anchor deleted on the branch still fails. head_ref is
      # the PR's source branch and is EMPTY on push, so a merge to main is checked against
      # published main alone. Anchors that resolved only via the branch are listed in the
      # job summary: they are unpublished, and merging this repo before the docs PR is
      # exactly what leaves them dangling.
      - name: check runbook_url annotations resolve to real docs anchors
        env:
          TATARA_DOCS_REF: ${{ github.head_ref }}
        run: python3 scripts/check_runbook_urls.py

      # Two-alerting-plane reconciliation (tatara-helmfile#440). Every check above guards
      # THIS repo's rules. None of them could see that tatara-operator's chart shipped 32
      # alerts of its own that Prometheus never loaded (ruleSelector wants
      # release=prometheus; the deploy repo never set the label) into an Alertmanager whose
      # only receiver is named "null". That plane is now disabled and this repo is the only
      # one, which makes the chart file the SPECIFICATION of conditions worth watching
      # rather than a deploy artifact - and leaves nothing reconciling the two.
      # tatara-operator#635 is what that costs: it filed an alert as "never written" on a
      # grep of this repo when the alert existed, in the plane that delivered nothing. A
      # competent audit of the wrong plane is indistinguishable from a real gap.
      #
      # Fails CLOSED on a clone failure, unlike the neutral skip in the step above. That
      # costs no availability: check_label_provenance.py already clones tatara-operator and
      # already fails closed on it, so this job cannot pass without that clone either way.
      - name: check chart alert parity against tatara-operator
        run: python3 scripts/check_chart_alert_parity.py

      # The routing contract (issue #117). Every check above asserts a rule is well-formed,
      # its metric exists, its labels exist on that metric, its threshold is in range, its
      # runbook resolves - and every one of them ASSUMES the rule is delivered. Delivery is
      # decided by two hand-copied label strings that nothing verified: `homelab=true` (the
      # parent policy) and `system=tatara` (the child route to the operator incident
      # webhook). Per-rule `labels` REPLACE the module default (main.tf:124 is a ternary),
      # first matching child wins, and the homelab node is muted all weekend - so a
      # warning/critical rule that drops `system` lints, plans, applies green, fires
      # correctly, emails into a Saturday mute, and NEVER mints an incident Task.
      #
      # Bidirectional and keyed on severity, because both directions have failed: `info`
      # rules must OMIT `system`, and the two #457 trend rules shipped carrying it - each
      # fire would have minted an incident for a condition nobody should be paged on. That
      # was caught by a human reading label sets. This is the CI half.
      - name: check routing labels
        run: python3 scripts/check_routing_labels.py
