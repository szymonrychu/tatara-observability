---
# Semver push-CD health, re-expressed on the task-centric stage machine (2026-07-12).
#
# The old rules read tatara_cd_cascade_failed / tatara_cd_cascade_stalled, gauges derived
# from Task.status.cascadeStage. The redesign DELETES cascadeStage. Because every alert
# file sets default_no_data_state: "OK", those rules would not have fired and would not
# have gone stale - they would have reported OK forever, leaving the merge/deploy path to
# a cluster-admin-scoped runner with zero alert coverage. See CROSS-REPO-CONTRACT K.
#
# 2026-08-08 (issue #97): repointed onto the tatara-operator v2.0.0 8-STATE lifecycle.
# v2.0.0 renamed status.stage -> status.state and took the metric surface with it, so every
# rule here was querying names that no longer exist: operator_task_stage_age_seconds ->
# operator_task_state_age_seconds, and the stage/stageReason labels -> state / stateReason
# (terminal) / parkReason (park). Because this file sets default_no_data_state: "OK" those
# rules did not fail - they reported Normal(NoData) forever, which is what silenced the
# merge/deploy wedge detector at 2026-08-08T06:45Z.
#
# The delivery path is now: under-implementation -> awaiting-review -> merged -> deployed -> done.
# NAMING TRAP, straight from the operator's own enum doc: `merged` and `deployed` name the
# PHASE, not the milestone. `merged` means the verdict is approve and the operator owns the
# merge cursor, NOT that every MR is merged - per-MR truth stays on mr.status.state. They are
# the direct successors of the old `merging` and `deploying` stages and carry the same F.4
# budgets, so the thresholds below are unchanged: merged 4h -> park(merge-timeout);
# deployed 2h -> park(deploy-timeout).
#
# The operator merges each repo in Task.spec.mergeOrder sequentially against the reviewed
# head SHA (contract C.5), persisting its position in status.mergeCursor.
#
# THE OTHER HALF OF THE RENAME (#521): `failed` is GONE as a state. The terminal set is now
# EXACTLY done|rejected, and a failure PARKS instead of terminating. So every rule here that
# read operator_task_terminal_total{stage="failed",...} now reads operator_task_parked_total
# {parkReason=...} - the only counter of a failure the platform still has.
#
# These rules page BEFORE the state budget elapses, so a human sees a wedged deploy while it
# is still a deploy and not yet a park. The park counter below is the backstop that catches
# the case where they missed it.
interval_seconds: 60
default_no_data_state: "OK"
rules:
  - name: "Tatara delivery parked on a merge or deploy timeout"
    queries:
      - expression: |
          sum by (parkReason) (increase(operator_task_parked_total{namespace="tatara",job="tatara-operator",parkReason=~"merge-timeout|deploy-timeout"}[30m])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-delivery-parked-on-a-merge-or-deploy-timeout"
      summary: "{{ index $values \"C\" }} park event(s) (park/un-park transitions, not distinct Tasks) with parkReason={{ index $labels \"parkReason\" }} in 30m - a park/un-park flap on one Task counts several times here, so this is an upper bound on Tasks affected, not a Task count. A merge or deploy state blew its budget (merged 4h, deployed 2h; each re-park gets a fresh 30m re-entry window, up to 3 per timeout cycle) and the Task was parked. Merged component code is NOT reaching the cluster. Un-parking re-enters merged/deployed cursor-resumed (contract F.6), it never re-enters under-implementation - so check the owned MergeRequest CRs and the tatara-helmfile apply run, not the agent."
    labels:
      homelab: "true"
      system: "tatara"
      component: "cd"
      severity: "critical"
  - name: "Tatara merge stage wedged"
    queries:
      - expression: |
          max by (task) (operator_task_state_age_seconds{namespace="tatara",job="tatara-operator",state="merged"})
    math_operator: ">"
    threshold: 7200
    for: 10m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-merge-stage-wedged"
      summary: "Task {{ index $labels \"task\" }} has been in state=merged for {{ index $values \"C\" }}s (>2h, half the 4h budget). state=merged names the PHASE, not the milestone: the verdict is approve and the operator owns the merge cursor, NOT that every MR is merged. The sequential merge over spec.mergeOrder has stopped advancing: a required check is red, the reviewed head SHA moved (409 -> state reverts to awaiting-review), or the forge is refusing the merge. It parks(merge-timeout) at 4h."
    labels:
      homelab: "true"
      system: "tatara"
      component: "cd"
      severity: "warning"
  - name: "Tatara deploy stage wedged"
    queries:
      - expression: |
          max by (task) (operator_task_state_age_seconds{namespace="tatara",job="tatara-operator",state="deployed"})
    math_operator: ">"
    threshold: 3600
    for: 10m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-deploy-stage-wedged"
      summary: "Task {{ index $labels \"task\" }} has been in state=deployed for {{ index $values \"C\" }}s (>1h, half the 2h budget). state=deployed names the PHASE, not the milestone: the merge landed and the operator is waiting on the deploy, NOT that the code is live. The merged code is not reaching the cluster: the component release job, the pin propagation, or the tatara-helmfile apply has not completed. It parks(deploy-timeout) at 2h."
    labels:
      homelab: "true"
      system: "tatara"
      component: "cd"
      severity: "critical"
  - name: "Tatara merge cursor stalled"
    queries:
      - expression: |
          max by (task, repo) (operator_merge_cursor_stalled_seconds{namespace="tatara",job="tatara-operator"})
    math_operator: ">"
    threshold: 3600
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-merge-cursor-stalled"
      summary: "Task {{ index $labels \"task\" }} merge cursor has not advanced past repo {{ index $labels \"repo\" }} for {{ index $values \"C\" }}s (>1h). The sequential merge is blocked on ONE repo in spec.mergeOrder, so every repo behind it in the order is blocked too. There is no lexical default for mergeOrder (contract A.4): if the order is wrong, the dependency it encodes is wrong."
    labels:
      homelab: "true"
      system: "tatara"
      component: "cd"
      severity: "warning"
  # v6 addition (fix M3-9). awaiting-review <-> merged on a moved head is the FOURTH
  # cycle in the F.4 cycle-cap table and the ONLY one that spawns a review pod
  # every lap: merged -> awaiting-review on a moved head does NOT touch mergeReentries
  # (only the parked path does), so nothing else in this file would catch it
  # accruing cost. headMoveReentries caps at 3 -> park(head-moving).
  #
  # #97: `failed` is gone as a state (#521 narrowed the terminal set to done|rejected and
  # made a failure PARK instead), and head-moving is now a member of the 28-value
  # status.parkReason vocabulary, verified in tatara-operator internal/stage/stage.go:96.
  # So this counts parks, not terminals. Grouped by the state the Task was in when it
  # parked, which is the closest thing to the old `failed` context: it will read
  # state=merged for the merge-cursor path.
  - name: "Tatara merge head kept moving"
    queries:
      - expression: |
          sum by (state) (increase(operator_task_parked_total{namespace="tatara",job="tatara-operator",parkReason="head-moving"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-merge-head-kept-moving"
      summary: "tatara-operator parked {{ index $values \"C\" }} Task(s) in 1h with parkReason=head-moving (from state={{ index $labels \"state\" }}) - the reviewed PR's head kept moving across 3 awaiting-review<->merged laps, spawning a fresh review pod every time before giving up. Check for a human pushing to the branch or a flapping CI autocommit on the PR."
    labels:
      homelab: "true"
      system: "tatara"
      component: "cd"
      severity: "warning"
  # v6 / K.2 minimum alert set: "merge / deploy BLOCKED (WARNING)". K.2's own text named
  # the query as operator_task_parked_total{...=~"merge-blocked|deploy-blocked"}, which
  # under the OLD 16-stage machine could never fire (F.3 defined both reasons as `failed`
  # terminals, and parked only ever carried merge-timeout/deploy-timeout), so this rule
  # was implemented against operator_task_terminal_total{stage="failed"} instead.
  #
  # #97/#521 INVERTED THAT: `failed` is gone as a state, a failure now PARKS, and both
  # merge-blocked and deploy-blocked are members of the status.parkReason vocabulary
  # (tatara-operator internal/stage/stage.go:84,86 and the ParkReasons list at :110).
  # K.2's original formulation is now the correct one and this is it.
  #
  # 2026-08-17: widened to also match merge-auth-refused and merge-order-missing. Gap
  # found via terraform!215 - a fully reviewed MR that tatara closed unmerged because
  # the Task parked(merge-auth-refused) and NOTHING fired: at one occurrence it cleared
  # neither this rule's old two-value matcher NOR the generic "Operator task failure
  # spike"/"park spike" catch-alls in tatara-operator.yaml, which both need >3 events in
  # a window to page. Confirmed against live Prometheus: operator_task_parked_total
  # {parkReason="merge-auth-refused"} is a real series (tatara-operator
  # internal/controller/merge.go:380, fires when the forge refuses the merge credential -
  # "a bad/insufficient credential never fixes itself on retry", so it fails fast to
  # parked instead of hot-requeueing). merge-order-missing is the same class - merge.go:254
  # parks it immediately when merging is entered with an empty spec.mergeOrder, "treated
  # as a bug". Both are UnparkNever (internal/stage/park.go), exactly like merge-blocked
  # and deploy-blocked: no cycle to exhaust, no auto re-entry, a human has to act. Query
  # against tatara-operator's 28-member parkReason vocabulary (internal/stage/stage.go)
  # turned up other UnparkNever CD-adjacent reasons that were DELIBERATELY LEFT OUT:
  #   operator-error   - also parked from non-CD sites (e.g. a stuck workspace PVC bind
  #                       before any pod runs), so folding it in here would mislabel a
  #                       pre-implementation failure as a merge/deploy one.
  #   ci-red/ci-blocked - the red-CI gate fires from awaiting-review and reviewpost.go as
  #                       much as from merging (ci_gate.go), so it is not CD-exclusive
  #                       either; still covered by the generic spike rules above.
  #   ownership-lost    - an ownership-flip park, not a merge/deploy blockage.
  #   head-moving        - already has its own dedicated rule below ("Tatara merge head
  #                       kept moving"), do not double-count it here.
  - name: "Tatara merge or deploy cycle exhausted"
    queries:
      - expression: |
          sum by (parkReason) (increase(operator_task_parked_total{namespace="tatara",job="tatara-operator",parkReason=~"merge-blocked|deploy-blocked|merge-auth-refused|merge-order-missing"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-merge-or-deploy-cycle-exhausted"
      summary: "{{ index $values \"C\" }} Task(s) parked with parkReason={{ index $labels \"parkReason\" }} in 1h. merge-blocked/deploy-blocked mean the merge or deploy state re-entered park(merge-timeout|deploy-timeout) more than 3 times (fix H7) and gave up; merge-auth-refused/merge-order-missing are fail-fast parks with no cycle at all (a forge credential the writer cannot use, or merging entered with an empty mergeOrder - tatara-operator internal/controller/merge.go). All four are UnparkNever - the Task sits until a human intervenes or ParkRetention reaps it. The delivery path to a cluster-admin-scoped runner has stopped, not just slowed."
    labels:
      homelab: "true"
      system: "tatara"
      component: "cd"
      severity: "critical"
