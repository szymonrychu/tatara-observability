---
interval_seconds: 60
default_no_data_state: "Alerting"
default_exec_err_state: "Alerting"
tatara_exec_err_justification: >-
  Loki-log-based rules only - with one deliberate exception, "Log collector node coverage
  incomplete", which reads Prometheus and therefore sets no_data_state/exec_err_state
  explicitly on itself to opt OUT of these defaults (a Loki blind spot cannot be detected
  by a Loki query; see that rule's own comment). For a Loki QUERY, NoData and ExecErr both also fire when the
  Loki BACKEND is degraded or unreachable (a Postgres connection-pool exhaustion event,
  "too many clients"), so reporting OK then is blindness dressed up as health
  (tatara-operator#381 gap 2). Every count_over_time(...) expression below carries an
  `or vector(0)` guard so a genuine zero-match sample is not conflated with the backend
  being down - the two must stay together. Terraform drops this key during object-type
  conversion; it never reaches Grafana and exists to make this decision greppable and
  CI-enforced (scripts/lint_alert_rules.py check 3).
# This file's rules are Loki-log-based, not gauge/counter-based like the rest of the
# platform's alert files - see the `tatara_exec_err_justification` key above for why
# NoData/ExecErr default to Alerting here specifically. Every count_over_time(...)
# expression below carries an `or vector(0)` guard for the reason that key gives: without
# it, a real "zero matching lines" result is ALSO an empty vector, and the Alerting
# default would turn every quiet period into a false page. The two changes MUST land
# together - `or vector(0)` alone (old default OK) or the state flip alone (no
# `or vector(0)`) each break one side of this.
rules:
  - name: "Tatara operator error log burst"
    queries:
      - expression: |
          sum(count_over_time({namespace="tatara", app="tatara-operator"} | pattern `<_> <_> <_> <body>` | line_format `{{.body}}` | json | level="ERROR" [5m])) or vector(0)
        datasource_uid: "efihqbqlmroqod"
        query_type: "loki"
    math_operator: ">"
    threshold: 20
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-operator-error-log-burst"
      summary: "tatara-operator logged {{ index $values \"C\" }} ERROR lines in 5m (>20). Investigate in Grafana Explore: {namespace=\"tatara\", app=\"tatara-operator\"} | pattern `<_> <_> <_> <body>` | line_format `{{\"{{\"}}.body{{\"}}\"}}` | json | level=\"ERROR\"."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # Contract K.3: the operator logs action=approval_verified / action=approval_refused to
  # its own stdout precisely so the C.6 approval gate becomes alertable at Loki retention
  # instead of the Task's TTL. Agent pods are NOT Loki-scraped; this selects the operator's
  # stream and only the operator's stream.
  - name: "Tatara approval refusals elevated"
    queries:
      - expression: |
          sum by (reason) (count_over_time({namespace="tatara", app="tatara-operator"} | pattern `<_> <_> <_> <body>` | line_format `{{.body}}` | json | action="approval_refused" [15m])) or on() vector(0)
        datasource_uid: "efihqbqlmroqod"
        query_type: "loki"
    math_operator: ">"
    threshold: 5
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-approval-refusals-elevated"
      summary: >-
        tatara-operator refused {{ index $values "C" }} approval attempt(s) in 15m (reason={{
        index $labels "reason" }}). The approval gate has no wordlist: the clarify agent judges
        whether a maintainer comment approves and CITES it, and the operator re-verifies the
        structural facts - the cited comment exists on the issue, its author is a verified
        non-bot maintainer, the agent's verbatim quote occurs in the body, and it has not
        approved once already (the citation need not be the newest maintainer comment; that
        withdrawal veto lives with the agent, not the operator). reason groups into three:
        no-citation and quote-not-in-comment mean the agent is mis-instructed (check the skills
        pin); citation-not-maintainer and evidence-replayed mean something is trying to force
        the gate; no-live-issue and no-maintainer-comment mean there is simply nothing to
        approve yet, not an attack. no-live-issue is every owned Issue closed, done or rejected
        - commonly a human closing it mid-flight as a deliberate veto, so do not blame the agent
        citation for it. no-maintainer-comment just means nobody has commented yet: clarify
        Tasks are outrunning their humans. A grant can also carry no citation at all when
        autoApproveTataraProposals covers a bot-authored proposal no human ever commented on.
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # SPLIT PER PROJECT 2026-08-08 (tatara-observability#93). It was a single namespace-wide
  # sum across every Project's memory stack, which made its coverage a per-Project LOTTERY
  # decided by node placement: the rule looked fleet-wide but could only see the Projects
  # whose memory pod happened to sit on one of the 3-of-5 nodes that run a log collector.
  # A Project on a blind node contributed a structural 0 that is indistinguishable from
  # health, and the `or vector(0)` guard - correctly there to tell a real zero from a Loki
  # outage - made the exclusion invisible too. At the time #93 was filed mem-mtg was the
  # excluded one, which is precisely the Project three open trackers were being diagnosed
  # against; when this fix was written all THREE memory API pods were on blind nodes
  # (mem-tatara on nas-d0w363i, mem-infrastructure and mem-mtg on worker-jtw3f33), so the
  # aggregate was reading a clean zero for the entire fleet.
  #
  # `project` comes from the `instance` stream label (mem-tatara, mem-infrastructure,
  # mem-mtg) via label_format, verified live against this datasource on 2026-08-08 - it
  # yields exactly {tatara, infrastructure, mtg}. Deliberately NOT derived from `pod`: the
  # pod name carries a ReplicaSet hash that changes on every rollout.
  #
  # The threshold is unchanged at 20, which makes it STRICTER than before: 20 ERROR lines
  # in 5m now has to come from ONE Project rather than from all of them added together.
  #
  # `or on() vector(0)` (not the bare `or vector(0)`) because this is now a `sum by (...)`:
  # same form as "Tatara approval refusals elevated" and "Tatara operator error recurring"
  # in this file, and required so the fabricated zero matches an empty grouped result.
  #
  # SPLITTING IS ONLY HALF THE FIX. It stops one Project masking another, but a Project
  # whose pod ships nothing STILL reads as a healthy zero here, and no Loki query can
  # detect its own blind spot. That half is "Tatara memory logs unscraped for a project"
  # below, which reads Prometheus. The two rules are a pair: this one is only trustworthy
  # for a Project the other one is silent about.
  - name: "Tatara memory error log burst"
    queries:
      - expression: |
          sum by (project) (count_over_time({namespace="tatara", app="tatara-memory"} | label_format project=`{{ trimPrefix "mem-" .instance }}` | pattern `<_> <_> <_> <body>` | line_format `{{.body}}` | json | level="ERROR" [5m])) or on() vector(0)
        datasource_uid: "efihqbqlmroqod"
        query_type: "loki"
    math_operator: ">"
    threshold: 20
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-memory-error-log-burst"
      summary: "tatara-memory logged {{ index $values \"C\" }} ERROR lines in 5m (>20) for project {{ index $labels \"project\" }}. This rule is PER-PROJECT and only covers Projects whose memory pod is on a node that runs a log collector - check \"Tatara memory logs unscraped for a project\" before reading any OTHER project's silence as health. Investigate in Grafana Explore: {namespace=\"tatara\", app=\"tatara-memory\", instance=\"mem-{{ index $labels \"project\" }}\"} | pattern `<_> <_> <_> <body>` | line_format `{{\"{{\"}}.body{{\"}}\"}}` | json | level=\"ERROR\"."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  # Chronic ERROR trickle (tatara-operator#381 gap 3): "Tatara operator error log burst"
  # above only catches a SPIKE (>20 ERROR lines in 5m). A steady low-rate ERROR (e.g.
  # ~1 line/50min) never crosses that bar and stays invisible indefinitely. Grouping by
  # msg lets each distinct error message cross its own much lower bar without one noisy
  # message masking a quiet one - verified safe to group by msg: only 11 distinct ERROR
  # msg values over a live 24h window (2026-07-19, via grafana MCP against datasource
  # efihqbqlmroqod), so cardinality is bounded and does not need topk/coarsening.
  # SCOPED TO container="tatara-operator" (tatara-operator#558). The bare
  # {namespace="tatara", app="tatara-operator"} selector also matches the ingest Job's pods:
  # the operator launches each repo's ingest Job under its own `app=tatara-operator` label
  # (only `container`/`component`/`pod` differ - verified live via query_loki_logs against
  # this datasource, 2026-08-09), so `ingest failed` ERROR lines from container="ingest" (a
  # completely different binary, internal/ingest in tatara-memory-repo-ingester) counted
  # against a rule that is supposed to be about the operator's own reconcile loop. Measured
  # over 24h: 32 `ingest failed` lines from container="ingest" alone would satisfy this
  # rule's >=2-per-hour bar on their own, and after the operator's own ERROR classes were
  # fixed (tatara-operator#558) `ingest failed` was the only msg still able to trip it.
  # container is a genuine top-level Loki label here (confirmed via list_loki_label_names),
  # so this satisfies the label-NAME provenance guard (tatara-observability#101). Ingest
  # Job failures are not dropped, just out of this rule's scope - they already have richer,
  # per-repo Prometheus coverage in alerts/tatara-ingester.yaml ("Tatara ingest job failing",
  # "Tatara ingest run failure ratio high", "Repository ingest stale", "Repository stuck in
  # failing ingest state"), which attribute failures to a project/repo and to full/incremental
  # mode - strictly better signal than a raw ERROR-log count keyed only on `msg` could give.
  # A duplicate Loki-log rule for the ingest Job was considered and rejected as redundant.
  - name: "Tatara operator error recurring"
    queries:
      - expression: |
          sum by (msg) (count_over_time({namespace="tatara", app="tatara-operator", container="tatara-operator"} | pattern `<_> <_> <_> <body>` | line_format `{{.body}}` | json | level="ERROR" [1h])) or on() vector(0)
        datasource_uid: "efihqbqlmroqod"
        query_type: "loki"
    math_operator: ">="
    threshold: 2
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-operator-error-recurring"
      summary: "tatara-operator logged {{ index $values \"C\" }} ERROR line(s) with msg=\"{{ index $labels \"msg\" }}\" in the last 1h (>=2). Below the 20-in-5m burst threshold but recurring - a chronic trickle. Scoped to container=\"tatara-operator\" so the ingest Job's own ERROR lines (container=\"ingest\", see alerts/tatara-ingester.yaml) cannot trip this rule. Investigate in Grafana Explore: {namespace=\"tatara\", app=\"tatara-operator\", container=\"tatara-operator\"} | pattern `<_> <_> <_> <body>` | line_format `{{\"{{\"}}.body{{\"}}\"}}` | json | level=\"ERROR\" | msg=\"{{ index $labels \"msg\" }}\"."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # callback_authn_failed (tatara-operator#381 gap 3) is logged at INFO level on the
  # operator's own turn-complete callback receiver, so it never crosses any
  # level="ERROR" filter above - a sustained run of rejected wrapper callbacks (expired/
  # rotated OIDC credential, misconfigured Project secret, wrapper pointed at the wrong
  # endpoint) would otherwise go unnoticed while every rejected callback drops a
  # completed agent turn (including any report_internal_issue payload) on the floor.
  # Mirrors "Tatara approval refusals elevated" above (also an INFO-level action label,
  # same 15m window / 5m for). Currently dormant (0 events over a live 24h window,
  # 2026-07-19) - wired-but-quiet, same precedent as "Operator orphan reap delete errors"
  # in alerts/tatara-operator.yaml.
  - name: "Tatara operator callback auth failures"
    queries:
      - expression: |
          sum (count_over_time({namespace="tatara", app="tatara-operator"} | pattern `<_> <_> <_> <body>` | line_format `{{.body}}` | json | action="callback_authn_failed" [15m])) or vector(0)
        datasource_uid: "efihqbqlmroqod"
        query_type: "loki"
    math_operator: ">"
    threshold: 5
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-operator-callback-auth-failures"
      summary: "tatara-operator logged {{ index $values \"C\" }} callback_authn_failed event(s) in 15m (>5). Logged at INFO level (invisible to the ERROR-log-burst rule) on the operator's turn-complete callback receiver. Investigate in Grafana Explore: {namespace=\"tatara\", app=\"tatara-operator\"} | pattern `<_> <_> <_> <body>` | line_format `{{\"{{\"}}.body{{\"}}\"}}` | json | action=\"callback_authn_failed\"."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # THE META-RULE FOR THIS FILE (tatara-observability#79). Every other rule above reads
  # Loki, and a Loki rule can only see a pod whose node runs a log collector. On
  # 2026-07-29 the promtail DaemonSet had desired_number_scheduled=3 against 5 Ready
  # nodes (node-exporter and smartctl-exporter both show 5 on the same cluster, so this
  # is promtail's own nodeSelector/tolerations, not a scheduling outage), and
  # list_loki_label_values(node_name) over 7d returned exactly
  # ["kubernetes-47d28x2","kubernetes-5vv07x2","kubernetes-jhv07x2"] - nas-d0w363i and
  # worker-jtw3f33 have never shipped a line. A tatara pod landing on either node is
  # invisible to every rule above, and the failure is SELF-CONCEALING: the rules report
  # a clean zero, which is indistinguishable from health. That is exactly how #79's
  # agent report was lost. The fix itself is infra (the collector DaemonSet is not in
  # any tatara-* repo); what belongs HERE is making the blind spot visible.
  #
  # PROMETHEUS, not Loki - deliberately. A Loki query cannot detect its own blind spot:
  # a node that ships nothing has no stream to select. kube-state-metrics is the only
  # surface that knows about nodes the collector never reached.
  #
  # Expression = "Ready nodes with no ready log-collector pod". A single subtraction
  # catches BOTH failure modes: the DaemonSet never being scheduled onto a node
  # (desired < nodes, today's case) and being scheduled but unhealthy (ready < desired).
  # The daemonset=~ alternation is deliberate: swapping promtail for alloy/vector must
  # not silently turn this rule into a permanent NoData.
  #
  # On the `or vector(0)`: it fires the WORST case rather than hiding it - if the
  # collector DaemonSet disappears entirely the right answer is "all N nodes are blind",
  # not NoData. It cannot fabricate a false page from a kube-state-metrics outage: that
  # empties the LHS too, and a binary op with an empty left operand yields an empty
  # result (NoData), never a number. Not a check-1 violation either - that check is
  # about `or vector(0)` under a `<` threshold; this is `>`.
  #
  # exec_err_state/no_data_state are set explicitly to override this file's Loki-shaped
  # Alerting defaults (see the top-level justification key): this rule reads Prometheus,
  # so a query error is a Prometheus/Grafana problem, not evidence of a coverage gap.
  #
  # for: 30m rides out a DaemonSet rolling update and a node reboot; the real condition
  # has persisted for 7+ days, so a slow rule loses nothing.
  #
  # Verified live 2026-07-29 (grafana MCP, uid=prometheus): this exact expression
  # evaluates to 2, matching the two known-blind nodes.
  - name: "Log collector node coverage incomplete"
    queries:
      - expression: |
          count(kube_node_status_condition{condition="Ready",status="true"} == 1)
          - (sum(kube_daemonset_status_number_ready{namespace="monitoring",daemonset=~"promtail|alloy|grafana-agent|vector|fluent-bit"}) or vector(0))
    math_operator: ">"
    threshold: 0
    for: 30m
    decimal_points: 0
    no_data_state: "NoData"
    exec_err_state: "Error"
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-log-collector-node-coverage-incomplete"
      summary: "IF THIS ARRIVED AS alertname=DatasourceError, STOP AND READ annotations.Error FIRST: the rest of this summary is the FIRING-case template rendered against an empty result set and every number in it is a lie (counts read 0, label values read empty). Grafana could not evaluate the rule at all. If Error mentions `pq:` or SQLSTATE 53300 (\"remaining connection slots are reserved\"), the failure is GRAFANA'S OWN backing Postgres (grafana-database-cluster, ns monitoring) - not this rule's datasource, not tatara, and not anything in the query below. See \"Grafana alert rule evaluation failing\" in alerts/tatara-grafana.yaml; that is the detector for it, and it recurs nightly around 03:30 UTC. OTHERWISE: {{ index $values \"C\" }} Ready node(s) have no ready log-collector pod, so every pod scheduled there ships NO logs to Loki. Every Loki-based rule in alerts/tatara-logs.yaml is blind on those nodes and reports a clean zero regardless - an empty Loki result for a pod there PROVES NOTHING. Find them: compare `count by (node) (kube_node_info)` against `count by (node) (kube_pod_info{namespace=\"monitoring\", created_by_name=\"promtail\"})`, then check the collector DaemonSet's nodeSelector/tolerations against those nodes' taints. This is an infra fix (the collector is not deployed by any tatara-* repo); until it lands, treat namespace-wide Loki queries as covering only part of the fleet. For the tatara memory stack the exclusion is SYSTEMATIC, not a pod unluckily landing: tatara-operator's componentAffinity (internal/memory/scheduling.go) deliberately spreads memory-stack pods across nodes for availability and is coverage-unaware, so maximising spread also maximises the chance a given Project's memory pod is blind. \"Tatara memory logs unscraped for a project\" reports which Projects that currently costs."
    labels:
      homelab: "true"
      system: "tatara"
      component: "observability"
      severity: "warning"
  # THE PER-PROJECT HALF OF THE COVERAGE GAP (tatara-observability#93). The meta-rule above
  # counts BLIND NODES; this one names the PROJECTS that blindness actually costs, which is
  # the question every Loki-based memory rule needs answered before its zero can be read as
  # health. It is the companion to "Tatara memory error log burst" above: that rule is only
  # trustworthy for a project this one is silent about.
  #
  # PROMETHEUS, not Loki, for the same reason the meta-rule is: a Loki query cannot detect
  # its own blind spot - a pod that ships nothing has no stream to select, so an unscraped
  # project and a healthy project are the same empty result. kube-state-metrics is the only
  # surface that knows about a pod on a node the collector never reached.
  #
  # THE EXPRESSION, term by term:
  #   - it selects on created_by_name, NOT pod. The memory API SERVER's ReplicaSet is named
  #     `mem-<project>-<rs-hash>`, and `mem-[a-z0-9]+-[0-9a-f]+` (Prometheus regexes are
  #     fully anchored) matches that and nothing else in the stack: mem-*-lightrag-<hash>
  #     fails because the middle segment would have to contain a literal `-`, and
  #     mem-*-pg / mem-*-neo4j are StatefulSets (created_by_kind filters them out, and
  #     `pg`/`neo4j` are not hex anyway). No alert rule selects the neo4j/lightrag/pg log
  #     streams, so their coverage is not this rule's business.
  #     Using created_by_name rather than pod also keeps the name stable across restarts -
  #     only the ReplicaSet hash moves, and that is what the capture discards.
  #   - label_replace lifts the project out of that name, because kube_pod_info carries no
  #     project label. Verified live 2026-08-08: it yields exactly {tatara, infrastructure,
  #     mtg}. NO `{n,m}` REGEX QUANTIFIERS ANYWHERE IN THIS EXPRESSION, deliberately:
  #     scripts/check_metric_provenance.py strips label-selector bodies with `\{[^}]*\}`,
  #     so a brace quantifier inside a label VALUE truncates the strip and makes the
  #     checker mis-read the remainder as a bare metric name.
  #   - `unless on (node)` drops every memory pod whose node DOES run a collector. What is
  #     left is exactly the blind ones. The daemonset alternation mirrors the meta-rule's,
  #     so swapping promtail for alloy/vector cannot silently turn this into a permanent
  #     firing.
  #   - the operator_memory_stacks term is the MEMORY-OPTIONAL GATE, identical in form and
  #     rationale to the one on "Repository ingest stale" in alerts/tatara-ingester.yaml:
  #     a project with no memory stack has no memory logs to be blind about, and must read
  #     as NOT APPLICABLE rather than permanently broken once the subsystem is disabled.
  #     It reads false both ways a disable could land (series absent for the project, or a
  #     future phase outside this set becoming current). See MEMORY.md 2026-08-08.
  #
  # Verified live 2026-08-08 (grafana MCP, uid=prometheus): this exact expression returns
  # {tatara=1, infrastructure=1, mtg=1} - all three memory API pods are currently on the
  # two nodes that have never shipped a line.
  #
  # PROMETHEUS RULE IN A LOKI FILE, so it opts OUT of this file's Loki-shaped defaults the
  # same way the meta-rule above does: a query error here is a Prometheus/Grafana problem,
  # not evidence of a coverage gap, and NoData means kube-state-metrics is gone rather than
  # that every project is covered.
  #
  # for: 30m rides out a rollout that reschedules a memory pod. The condition it reports is
  # structural (the operator's anti-affinity is coverage-unaware by design), so a slow rule
  # loses nothing.
  - name: "Tatara memory logs unscraped for a project"
    queries:
      - expression: |
          count by (project) (
            (label_replace(
               kube_pod_info{namespace="tatara", created_by_kind="ReplicaSet", created_by_name=~"mem-[a-z0-9]+-[0-9a-f]+"},
               "project", "$1", "created_by_name", "mem-(.+)-[0-9a-f]+")
             unless on (node)
             count by (node) (kube_pod_info{namespace="monitoring", created_by_name=~"promtail|alloy|grafana-agent|vector|fluent-bit"}))
            and on (project)
            (max by (project) (operator_memory_stacks{namespace="tatara",job="tatara-operator",phase=~"Ready|Provisioning|Degraded|Failed"}) > 0)
          )
    math_operator: ">"
    threshold: 0
    for: 30m
    decimal_points: 0
    no_data_state: "NoData"
    exec_err_state: "Error"
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-memory-logs-unscraped-for-a-project"
      summary: "Project {{ index $labels \"project\" }} has {{ index $values \"C\" }} tatara-memory API pod(s) on a node with no log collector, so it ships NO logs to Loki. \"Tatara memory error log burst\" therefore reports a structural zero for this project and an empty Loki result for it PROVES NOTHING - do not read it as health, and re-read any investigation that concluded from it. This is not a pod unluckily landing: tatara-operator's componentAffinity (internal/memory/scheduling.go) spreads memory-stack pods across nodes for availability and is coverage-unaware, so on a cluster where only 3 of 5 nodes run a collector the spread systematically produces this. Find the pod and its node: count by (node, pod) (kube_pod_info{namespace=\"tatara\", pod=~\"mem-.*\"}). The real fix is infra - give the collector DaemonSet the toleration set that prometheus-prometheus-node-exporter uses to reach 5/5 - and is tracked by \"Log collector node coverage incomplete\" in this same file. A project with no memory stack is not evaluated by this rule at all."
    labels:
      homelab: "true"
      system: "tatara"
      component: "observability"
      severity: "warning"
