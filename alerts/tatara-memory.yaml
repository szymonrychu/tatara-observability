---
interval_seconds: 60
default_no_data_state: "OK"
rules:
  # ---------------------------------------------------------------------------
  # Workload-generic rules (kube-state-metrics) pinned to the memory API server
  # pods. The memory server runs one Deployment per Project (mem-<project>-...),
  # so the selector matches mem-* but excludes the neo4j/pg/lightrag sidecar
  # workloads. These rules key off kube-state-metrics for pod-lifecycle state
  # (readiness, restarts, OOM, waiting reason), which is only available there
  # regardless of app-level scrape.
  # ---------------------------------------------------------------------------
  - name: "Memory API server pod not ready"
    queries:
      - expression: |
          max(kube_pod_status_ready{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",condition="true"}) by (pod)
    math_operator: "<"
    threshold: 1
    for: 10m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-api-server-pod-not-ready"
      summary: "tatara-memory pod {{ index $labels \"pod\" }} not Ready for 10m. Project memory API degraded."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "critical"
  - name: "Memory API server crash looping"
    queries:
      - expression: |
          max(rate(kube_pod_container_status_restarts_total{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*"}[15m]) * 900) by (pod)
    math_operator: ">"
    threshold: 2
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-api-server-crash-looping"
      summary: "tatara-memory pod {{ index $labels \"pod\" }} restarting ~{{ index $values \"C\" }} times / 15m. Crash loop."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory API server OOMKilled"
    queries:
      - expression: |
          max(kube_pod_container_status_last_terminated_reason{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",reason="OOMKilled"}) by (pod)
    math_operator: ">"
    threshold: 0
    for: 1m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-api-server-oomkilled"
      summary: "tatara-memory pod {{ index $labels \"pod\" }} was OOMKilled. Raise memory limit or investigate leak."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory API server container stuck waiting"
    queries:
      - expression: |
          max(kube_pod_container_status_waiting_reason{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerError|CreateContainerConfigError"}) by (pod,reason)
    math_operator: ">"
    threshold: 0
    for: 10m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-api-server-container-stuck-waiting"
      summary: "tatara-memory pod {{ index $labels \"pod\" }} container stuck waiting ({{ index $labels \"reason\" }}) for 10m."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "critical"
  # ---------------------------------------------------------------------------
  # Component-specific rules. Metric names + label keys are taken verbatim from
  # tatara-memory/internal/**/metrics.go. The mem-* pods are scraped by
  # Prometheus (job=tatara-memory), so these series are live.
  # ---------------------------------------------------------------------------
  - name: "Memory HTTP 5xx error ratio high"
    queries:
      - expression: |
          sum(rate(http_requests_total{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",route!~"/readyz|/healthz|/metrics",status=~"Internal Server Error|Bad Gateway|Service Unavailable|Gateway Timeout|Not Implemented|HTTP Version Not Supported"}[10m]))
          /
          clamp_min(sum(rate(http_requests_total{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",route!~"/readyz|/healthz|/metrics"}[10m])), 0.001)
    math_operator: ">"
    threshold: 0.05
    for: 10m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-http-5xx-error-ratio-high"
      summary: "tatara-memory HTTP 5xx ratio {{ index $values \"C\" }} (>5%, excludes /readyz|/healthz|/metrics probes) over 10m. API serving errors."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  # class!="maintenance" on BOTH sides. Provenance corrected 2026-07-29: tatara-memory#84
  # is the ISSUE; the producer change is tatara-memory PR #92 ("fix(observability): log
  # purge-path errors, split maintenance metric class"), which widens
  # tatara_memory_op_total from {op,result} to {op,class,result} with class="maintenance"
  # for delete_by_source/delete_by_sources and class="user" for everything else. That PR
  # is still OPEN, so the label is not live yet - see the forward-compatibility note
  # below, which is what makes shipping ahead of it safe. This rule's premise, stated in its own
  # summary, is "agents failing to read/write memory"; a purge sweep erroring is neither
  # agent-facing nor a reason to page. Live evidence for why it mattered (2026-07-29,
  # grafana MCP): delete_by_source and delete_by_sources carried 65 errors each against
  # 60/21 successes, and the unfiltered ratio spiked to 0.15 - 50% over the 0.1 threshold
  # - inside the last 24h, entirely on those two maintenance ops.
  #
  # A negative matcher on an ABSENT label also matches (absent == ""), so this is
  # forward-compatible: the producer change is not deployed yet, and today the filtered
  # and unfiltered expressions return an identical value (both 0, verified live). It
  # starts excluding maintenance the moment the label ships - no second edit, and no
  # window where the rule selects nothing.
  - name: "Memory service operation error ratio high"
    queries:
      - expression: |
          sum(rate(tatara_memory_op_total{namespace="tatara",result="error",op!~"get|get_entity",class!="maintenance"}[10m]))
          /
          clamp_min(sum(rate(tatara_memory_op_total{namespace="tatara",op!~"get|get_entity",class!="maintenance"}[10m])), 0.001)
    math_operator: ">"
    threshold: 0.1
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-service-operation-error-ratio-high"
      summary: "tatara-memory service op error ratio {{ index $values \"C\" }} (>10% of memory service ops - writes + non-lookup reads - erroring over 10m; get/get_entity not-found and class=maintenance purge ops excluded). Agents failing to read/write memory."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory API server HTTP handler panics"
    queries:
      - expression: |
          sum(increase(http_panics_total{job="tatara-memory"}[15m]))
    math_operator: ">"
    threshold: 0
    for: 1m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-api-server-http-handler-panics"
      summary: "tatara-memory recovered {{ index $values \"C\" }} HTTP handler panic(s) in 15m. Investigate the memory API handler crash."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory LightRAG call error ratio high"
    queries:
      - expression: |
          sum(rate(lightrag_calls_total{namespace="tatara",result="error"}[10m]))
          /
          clamp_min(sum(rate(lightrag_calls_total{namespace="tatara"}[10m])), 0.001)
    math_operator: ">"
    threshold: 0.1
    for: 10m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-lightrag-call-error-ratio-high"
      summary: "tatara-memory LightRAG client error ratio {{ index $values \"C\" }} (>10%) over 10m. Ingest/query backend failing."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory LightRAG call p95 latency high"
    queries:
      - expression: |
          histogram_quantile(0.95, sum(rate(lightrag_call_duration_seconds_bucket{namespace="tatara"}[10m])) by (le)) and on() (sum(rate(lightrag_call_duration_seconds_count{namespace="tatara"}[10m])) > 0)
    math_operator: ">"
    # 5, not 30: lightrag_call_duration_seconds is prometheus.DefBuckets, so
    # histogram_quantile can never return above 10 and `> 30` was structurally inert
    # (#111). 5 is the highest DefBuckets bound under that ceiling. ARMED BLIND: no
    # lightrag_* series has ever been scraped cluster-wide, so this rule is also inert
    # for a second, independent reason and the number has no observed distribution
    # behind it. Retune it against real data once the series exists.
    threshold: 5
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-lightrag-call-p95-latency-high"
      summary: "tatara-memory LightRAG call p95 latency {{ index $values \"C\" }}s (>5s) over 10m. Backend slow."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory ingest job failure ratio high"
    queries:
      - expression: |
          sum(rate(ingest_jobs_total{namespace="tatara",status="failed"}[30m]))
          /
          clamp_min(sum(rate(ingest_jobs_total{namespace="tatara"}[30m])), 0.001)
    math_operator: ">"
    threshold: 0.2
    for: 30m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-ingest-job-failure-ratio-high"
      summary: "tatara-memory ingest job failure ratio {{ index $values \"C\" }} (>20%) over 30m. Repo ingestion degraded."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory ingest item error rate elevated"
    queries:
      - expression: |
          sum(rate(ingest_items_total{namespace="tatara",result=~"error|timeout"}[15m]))
    math_operator: ">"
    threshold: 0
    for: 30m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-ingest-item-error-rate-elevated"
      summary: "tatara-memory ingest items erroring/timing out at {{ index $values \"C\" }}/s for 30m. Items being dropped."
    labels:
      homelab: "true"
      component: "memory"
      severity: "info"
  - name: "Memory code-graph query errors"
    queries:
      - expression: |
          sum(rate(code_graph_query_total{namespace="tatara",result="error"}[10m]))
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-code-graph-query-errors"
      summary: "tatara-memory code-graph queries erroring at {{ index $values \"C\" }}/s for 15m. Agent graph traversals failing."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory code-graph analytics stalled with dirty repos"
    queries:
      - expression: |
          max(code_graph_analytics_dirty_repos{namespace="tatara"})
          * on() group_left()
          (sum(rate(code_graph_analytics_runs_total{namespace="tatara"}[30m])) == bool 0)
    math_operator: ">"
    threshold: 0
    for: 1h
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-code-graph-analytics-stalled-with-dirty-repos"
      summary: "tatara-memory code-graph analytics stalled: {{ index $values \"C\" }} dirty repos with no recompute in 30m. Centrality/community data stale."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  # ---------------------------------------------------------------------------
  # PORTED OFF THE tatara-memory CHART (2026-08-23, tatara-observability#120).
  #
  # The memory stack's alerts were defined on THREE divergent planes: the chart's
  # PrometheusRule (10 rules, never installed - the operator provisions the stack
  # as native objects), tatara-operator's memoryAlertRules (15, Prometheus plane,
  # route.receiver: "null"), and this file (16, the only plane that mints an
  # incident Task). The operator's port claimed to be verbatim and was 6 of 10.
  # The five conditions below had a witness on NEITHER delivering plane.
  #
  # Four of them are the compensating controls written for tatara-memory#89: a
  # wedged code-graph analytics recompute held Postgres connections, mem-mtg-pg
  # backends went 4 -> 87 over 5.5h, and the incident was only visible six hours
  # in, database-side, at SQLSTATE 53300 with all 97 non-superuser slots held.
  # There was NO signal from the tatara-memory process at all. The fifth is the
  # memory API's only p99 latency witness.
  #
  # SCOPING (pre-mortem 1). These use this file's namespace/pod idiom, NOT the
  # chart's job=~".*tatara-memory.*". The go_sql_* family is client_golang's
  # DBStatsCollector and is NOT tatara-specific: the only go_sql_in_use_connections
  # series in this Prometheus today are Grafana's own (job="prometheus-grafana",
  # namespace="monitoring"), four of them. Both pool rules additionally pin
  # db_name="tatara_memory" - the registerer name at cmd/tatara-memory/app.go:315 -
  # so they cannot select Grafana's pool even if the namespace selector were
  # loosened later.
  #
  # ARMED BLIND, AND DELIBERATELY NOT NoData-SHAPED (pre-mortem 2). Memory is off
  # on every project since 2026-08-09 (operator_memory_stacks{phase="Disabled"}=1
  # for tatara, infrastructure and mtg), so none of these five metrics has a single
  # series right now and no threshold below has an observed distribution behind it.
  # There is deliberately no `or vector(0)` and no per-rule no_data_state override:
  # all five are `>` rules, absence of series is absence of the condition, and the
  # absence of the whole stack is already watched by the pod-readiness rules and by
  # "Memory stack stuck not ready". Fabricating a zero would be #111's silent-green
  # class arriving through the front door, and forcing Alerting on NoData would page
  # permanently against a subsystem that is off on purpose. Thresholds are the
  # chart's own (values.yaml:240-256), carried here with their reasoning so they
  # survive independently of that file. RETUNE TRIGGER: the first re-enable. Do not
  # arm these and re-enable memory in the same change - a cold stack will trip the
  # pool and admission rules during warmup and the reflex is to widen `for:` until
  # it stops.
  # ---------------------------------------------------------------------------
  - name: "Memory bulk admission shedding"
    queries:
      - expression: |
          sum by (class) (rate(http_admission_total{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",result="shed"}[10m]))
    math_operator: ">"
    # admissionShedRate. Shed load is answered with 429 + Retry-After, never a 5xx,
    # so "Memory HTTP 5xx error ratio high" above structurally cannot see a
    # concurrent-ingest burst - the two signals are disjoint by design. 0.05/s is
    # ~30 shed requests across the window: sustained overload, not one burst.
    threshold: 0.05
    for: 10m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-bulk-admission-shedding"
      summary: "tatara-memory is shedding bulk requests on class {{ index $labels \"class\" }} at {{ index $values \"C\" }}/s (>0.05/s) over 10m. Callers are offering more concurrent bulk work than the admission budget allows; the service is protecting its Postgres pool with 429s, not failing."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory Postgres connection pool saturated"
    queries:
      - expression: |
          sum by (pod) (go_sql_in_use_connections{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",db_name="tatara_memory"})
          /
          clamp_min(sum by (pod) (go_sql_max_open_connections{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",db_name="tatara_memory"}), 1)
    math_operator: ">"
    # dbPoolSaturationRatio. tatara-memory shares one pool across the whole process,
    # /readyz included: a pool that stays full fails readiness and deadlocks a
    # rollout against its own health check.
    threshold: 0.8
    for: 10m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-postgres-connection-pool-saturated"
      summary: "tatara-memory pod {{ index $labels \"pod\" }} has {{ index $values \"C\" }} of its Postgres pool in use (>80%) for 10m. Every caller in the process shares this pool including /readyz; find what is holding connections before raising the pool size. This is one of the two tatara-memory#89 controls."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory Postgres connection pool waiting"
    queries:
      - expression: |
          sum by (pod) (rate(go_sql_wait_duration_seconds_total{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",db_name="tatara_memory"}[5m]))
    math_operator: ">"
    # dbPoolWaitSecondsPerSecond. Seconds spent waiting to acquire a connection per
    # second of wall clock: the earliest honest symptom, since callers queue before
    # anything errors. This climbs before saturation crosses 80%; treat the two as
    # one investigation.
    threshold: 0.5
    for: 10m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-postgres-connection-pool-waiting"
      summary: "tatara-memory pod {{ index $labels \"pod\" }} spent {{ index $values \"C\" }}s per second waiting to acquire a Postgres connection over 5m (sustained 10m). The pool is undersized or a caller is holding a connection far longer than it should. This is one of the two tatara-memory#89 controls."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  # The COMPLEMENTARY ARM of "Memory code-graph analytics stalled with dirty repos"
  # above, not a duplicate of it. That rule fires on ZERO runs in 30m; this one
  # fires on runs that DO run and are cut off by ANALYTICS_RECOMPUTE_TIMEOUT. A
  # recompute that runs on schedule and times out every single time satisfies
  # neither alone - rate(code_graph_analytics_runs_total[30m]) != 0 keeps the
  # stalled rule quiet while nothing actually completes. That gap is exactly the
  # wedge tatara-memory#89 started with.
  - name: "Memory code-graph analytics recompute timing out"
    queries:
      - expression: |
          sum(increase(code_graph_analytics_runs_total{namespace="tatara",result="timeout"}[1h]))
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-code-graph-analytics-recompute-timing-out"
      summary: "tatara-memory cut off {{ index $values \"C\" }} code-graph analytics recompute(s) at their per-run deadline in the last hour. A recompute holds database connections while it runs; a wedged one is how tatara-memory#89 started. Do not raise ANALYTICS_RECOMPUTE_TIMEOUT to silence this - check the Postgres pool and pg_stat_activity for the holder."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  - name: "Memory API request p99 latency high"
    queries:
      - expression: |
          histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",route!~"/readyz|/healthz|/metrics"}[10m]))) and on() (sum(rate(http_request_duration_seconds_count{namespace="tatara",pod=~"mem-.+",pod!~"mem-.*-(neo4j|pg|lightrag).*",route!~"/readyz|/healthz|/metrics"}[10m])) > 0)
    math_operator: ">"
    # retrievalLatencyP99Seconds. The probe routes are excluded on BOTH sides, the
    # same three "Memory HTTP 5xx error ratio high" above excludes and for a sharper
    # reason: /readyz and /healthz are fast and scraped on a fixed cadence per pod, so
    # they are a large, permanently-fast share of the population. A p99 is a RANK, and
    # padding the population with fast samples walks that rank down into the fast
    # buckets - the busier the probes, the more real tail latency the rule tolerates
    # before firing. The chart original did not exclude them; this is one of the ported
    # rules that is better than its original rather than a faithful copy.
    #
    # The `and on()` clause is an idle-NaN guard:
    # histogram_quantile over zero requests returns NaN, which would read as "no
    # data" rather than "idle" - the clause makes an idle service unable to read as
    # a slow one. The bucket ceiling here is 300s, NOT the 10s three copies of this
    # rule's comment asserted: the histogram is requestDurationBuckets
    # (tatara-memory/internal/httpapi/middleware.go:199), which extends DefBuckets
    # with 30/60/120/240/300. Those three comments are corrected in this change;
    # scripts/histogram_bounds.txt now carries the real bound so Check 4 validates
    # this threshold rather than the stale one.
    threshold: 2.5
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-api-request-p99-latency-high"
      summary: "tatara-memory p99 request latency {{ index $values \"C\" }}s (>2.5s) over 10m, sustained 15m. This is the memory API's only end-to-end latency witness; elevated p99 here often traces to LightRAG, Neo4j or a queued Postgres pool rather than the API layer itself."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  # ---------------------------------------------------------------------------
  # Root-cause early-warning added after the 2026-07-05 mem-tatara-pg WAL-fill
  # incident: the CNPG postgres volumes slowly filled with un-recyclable WAL
  # (a replica down for days held a replication slot) until the CephFS quota was
  # exceeded, crashlooping the cluster below memory quorum and gating every tatara
  # Task for ~4h. NO disk-fullness alert existed, so the only signal was a
  # symptom (HTTP 5xx) firing AFTER the outage - and that symptom's incident agent
  # was itself gated on the down memory (circular). These two rules catch the root
  # cause days early (volume filling) and the platform-level symptom (memory stuck
  # not-Ready), independent of the memory app being up.
  #
  # 2026-07-26: the CIRCULAR half of that story is HISTORY, not current behaviour.
  # tatara-operator#470 removed the two spawn/turn gates, so agents now run while
  # memory is unhealthy - degraded (no recall), not blocked. The incident agent can
  # therefore investigate its own memory outage. Only the RE-INGEST gate remains.
  # The rules below are worded for that world; do not re-import the old
  # "the whole project stalls" framing from the incident writeups above.
  # ---------------------------------------------------------------------------
  - name: "Memory PVC volume near full"
    queries:
      - expression: |
          min(
            kubelet_volume_stats_available_bytes{namespace="tatara",persistentvolumeclaim=~"mem-.*"}
            /
            kubelet_volume_stats_capacity_bytes{namespace="tatara",persistentvolumeclaim=~"mem-.*"}
          ) by (persistentvolumeclaim)
    math_operator: "<"
    threshold: 0.15
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-pvc-volume-near-full"
      summary: "tatara-memory PVC {{ index $labels \"persistentvolumeclaim\" }} is {{ index $values \"C\" }} free (below 15%). Postgres WAL/data fill leads to a CNPG crash loop below memory quorum; expand storage (Project spec.memory.pgStorage / neo4jStorage) before it hits 0."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "warning"
  # operator_memory_stacks gained a `project` label (tatara-operator#457/#458), so this
  # is now per-project instead of a fleet-wide count: the project lands on the alert
  # instance and the incident webhook can attribute the outage to the project that owns
  # the stack. Phases are exactly Provisioning|Ready|Failed|Degraded
  # (project_controller.go memoryStackPhases).
  # Degraded IS selected, and adding it fixes a latent hole: Degraded is not a milder
  # Ready, it is "has been Provisioning past MemoryConfig.ProvisioningTimeout" (45m by
  # chart default, project_memory.go's #355 bounded-provisioning timeout). On that
  # transition the Provisioning series drops to 0, so a Provisioning|Failed-only selector
  # RESOLVED this alert at the exact moment the stack was declared hopeless. Note it is
  # NOT the #442/#461 degraded-but-quorate postgres case: that one leaves the phase alone
  # and only sets MemoryReady=False/PostgresDegraded, and is covered by the stateful-member
  # rule below, not by this gauge.
  - name: "Memory stack stuck not ready"
    queries:
      - expression: |
          max by (project) (operator_memory_stacks{namespace="tatara",job="tatara-operator",phase=~"Provisioning|Failed|Degraded"})
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-stack-stuck-not-ready"
      summary: "The tatara-memory stack for project {{ index $labels \"project\" }} has been stuck in Provisioning/Failed/Degraded for 15m (not Ready). Agents are NOT blocked by this any more (operator #470): pods still spawn and turns still run, but with NO recall for the whole turn, so what ships is degraded-quality output - see operator_agent_pod_degraded_total for how much of it. What DOES stop: per-repo re-ingest is held by the memory-readiness gate (operator_repository_ingest_gated), so the recall corpus goes stale on top of being unreachable; and any status write whose eviction batch cannot be spilled is REFUSED outright rather than losing data (operator_objbudget_spill_blocked_total), which wedges those objects until memory returns. Check the CNPG cluster + PVCs directly."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "critical"
  # 2026-07-06 follow-up, same mem-tatara-pg family: the WAL-fill fix left a 2Gi
  # dedicated WAL volume that was itself too small, crashlooping both cnpg REPLICAS
  # for ~8h at 1/3 ready. It went unnoticed because every pod-lifecycle rule above
  # EXCLUDES the backing stores (pod!~"...-(neo4j|pg|lightrag)...") and "Memory
  # stack stuck not ready" stayed silent - the memory API kept serving via the
  # surviving primary, so the stack read Ready while HA was gone. This is the mirror
  # of "Memory API server container stuck waiting" for the stateful HA members. Keyed
  # on the container waiting REASON, not pod-not-ready, so a legitimate replica
  # re-clone (Running through basebackup/catchup, which can exceed 10m on a large DB)
  # does NOT fire - only a genuinely stuck container (crash loop, image/create error)
  # does. The anchored -(pg|neo4j)-[0-9]+ selector matches the stable instance pods
  # (mem-*-pg-N, mem-*-neo4j-N), not the transient -join-/basebackup clone pods.
  # Critical: a member stuck 10m means HA is degraded (or a store is down) and the
  # incident agent must act BEFORE the primary also fails and hard-gates the whole
  # project (the circular-deadlock case). A downed replica leaves memory serving, so
  # that agent can still run. (lightrag outages surface via the LightRAG/API rules.)
  #
  # keep_firing_for: 30m IS A DE-FLAPPER, NOT A LONGER `for`. Without it this rule resolves
  # the instant a crash-looping member happens to be Running between restarts, and every flap
  # back mints a BRAND NEW incident issue for one continuous fault - which is exactly how
  # #444 and #448 were opened as two separate issues for one crash loop. #82 latched this in
  # PromQL (max_over_time(...[30m])) because the module did not declare keep_firing_for and
  # Terraform's object-type conversion silently DROPS undeclared attributes, so the real knob
  # was unreachable from this file. The module declares it now (2026-07-26), so the latch is
  # gone from the expression and the hold is done where it belongs: Grafana holds the rule
  # Firing for 30m after the condition clears, and the expression means what it says again.
  # KNOWN TRADE-OFF: keep_firing_for holds a FIRING alert; it does not hold the PENDING
  # window, so `for: 10m` again needs 10m of continuously-observed stuck state. Early in a
  # crash loop (10-40s backoff) a scrape can land on the brief Running window and reset that
  # timer, which can delay the first fire by an eval round or two; once the backoff reaches
  # its 5m cap the waiting state dominates and it fires. That delay is the price of not
  # paging about a container that recovered 40 minutes ago, which is what the 30m PromQL
  # latch plus `for: 10m` could do. If a real crash loop is ever observed failing to fire,
  # add a SHORT max_over_time (e.g. [5m]) as an honest smoothing window - not a 30m latch.
  - name: "Memory postgres or neo4j container stuck waiting"
    queries:
      - expression: |
          max by (pod,reason) (kube_pod_container_status_waiting_reason{namespace="tatara",pod=~"mem-.*-(pg|neo4j)-[0-9]+",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerError|CreateContainerConfigError"})
    math_operator: ">"
    threshold: 0
    for: 10m
    keep_firing_for: 30m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-memory-postgres-or-neo4j-container-stuck-waiting"
      summary: "tatara-memory stateful pod {{ index $labels \"pod\" }} (cnpg postgres or neo4j) container stuck ({{ index $labels \"reason\" }}) for 10m. A cnpg postgres member stuck = HA degraded while the primary keeps serving (this silently masked an 8h replica crash loop on 2026-07-06); a neo4j pod stuck = graph queries failing. This rule keeps firing for 30m after the container recovers, so one crash loop is one incident rather than one per flap (#444 + #448 were minted as separate issues for the same fault) - a container can therefore be healthy again while the alert is still firing; check current state before closing. Check the CNPG cluster (kubectl cnpg status mem-<project>-pg) / the neo4j StatefulSet."
    labels:
      homelab: "true"
      system: "tatara"
      component: "memory"
      severity: "critical"
