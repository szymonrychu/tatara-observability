---
interval_seconds: 60
default_no_data_state: "OK"
rules:
  # ----------------------------------------------------------------------------
  # Workload-generic: target down, crash loop, OOM, container-waiting, not-ready.
  # Pinned to the tatara-operator Deployment in namespace tatara.
  # ----------------------------------------------------------------------------
  - name: "Operator scrape target down"
    queries:
      - expression: |
          sum(up{namespace="tatara",job="tatara-operator"}) or vector(0)
    math_operator: "<"
    threshold: 1
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-scrape-target-down"
      summary: "All tatara-operator replicas are down (sum(up)={{ index $values \"C\" }}). The platform control loop is dead: no reconciles, webhooks, or agent turns. The `or vector(0)` fallback makes this fire even when the scrape targets have vanished entirely (e.g. scaled to zero)."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # Fires when the Deployment is SUPPOSED to be running (spec_replicas >= 1) but
  # has zero available replicas - unschedulable, or every pod failing readiness.
  # Two deliberate design choices (issue #33):
  #   1. Gated on `and (max(kube_deployment_spec_replicas) >= 1)` so an
  #      INTENTIONAL scale-to-zero does not page. When spec is 0 the guard drops
  #      the series -> empty -> NoData -> default_no_data_state: OK.
  #   2. NO `or vector(0)` fallback. A fabricated 0 turned a transient
  #      kube-state-metrics scrape gap (series briefly absent) into a false
  #      CRITICAL - the #33 root cause. Without it, an absent series is NoData
  #      -> OK, not a page.
  # Full-outage / Deployment-deleted coverage is unaffected: "Operator scrape
  # target down" (sum(up) or vector(0)) and "Operator pod not ready" still page
  # when the operator is gone entirely, independent of kube-state-metrics.
  - name: "Operator deployment has no available replicas"
    queries:
      - expression: |
          max(kube_deployment_status_replicas_available{namespace="tatara",deployment="tatara-operator"}) and (max(kube_deployment_spec_replicas{namespace="tatara",deployment="tatara-operator"}) >= 1)
    math_operator: "<"
    threshold: 1
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-deployment-has-no-available-replicas"
      summary: "tatara-operator Deployment has {{ index $values \"C\" }} available replicas (<1) while its spec calls for >=1. It is unschedulable or every pod is failing readiness; the platform control loop is down. Gated on spec_replicas>=1 so an intentional scale-to-zero does not fire, and it reports NoData (not a fabricated 0) during a transient kube-state-metrics gap."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # Fires on PARTIAL HA degradation: 1-2 of the 3 replicas up (leader election
  # still works but redundancy is reduced). NO `or vector(0)` fallback (issue #50,
  # same class as #33): a fabricated 0 turned a transient scrape gap - every `up`
  # series briefly absent on an environment cold start or a Prometheus restart -
  # into a false 0 that satisfied `< 3` for the whole 15m `for:` window while all
  # 3 replicas were healthy. Without it, an empty `up == 1` set is NoData -> OK
  # (default_no_data_state), not a page. `count(up == 1)` already excludes down
  # targets (they report up=0), so a genuine 1-2/3 degradation still fires.
  # A full 0/3 outage is deliberately NOT this warning's job: series present-but-0
  # or vanished -> empty count -> NoData -> OK here, and pages instead via the
  # CRITICAL "Operator scrape target down" (sum(up) or vector(0) < 1) and "Operator
  # pod not ready", which intentionally DO fabricate a 0 to page on total absence.
  - name: "Operator replica missing"
    queries:
      - expression: |
          count(up{namespace="tatara",job="tatara-operator"} == 1)
    math_operator: "<"
    threshold: 3
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-replica-missing"
      summary: "Only {{ index $values \"C\" }}/3 tatara-operator replicas are up. Leader election and HA are degraded. Partial-degradation only (1-2/3): a full 0/3 outage or a transient scrape gap is NoData -> OK here and pages via the CRITICAL down rules instead."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator crash looping"
    queries:
      - expression: |
          max by (pod) (increase(kube_pod_container_status_restarts_total{namespace="tatara",pod=~"tatara-operator-.*",container="tatara-operator"}[15m]))
    math_operator: ">"
    threshold: 2
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-crash-looping"
      summary: "tatara-operator container restarted {{ index $values \"C\" }} times in 15m. Pod {{ index $labels \"pod\" }} is crash looping."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  - name: "Operator OOMKilled"
    queries:
      - expression: |
          max by (pod) (kube_pod_container_status_last_terminated_reason{namespace="tatara",pod=~"tatara-operator-.*",reason="OOMKilled"})
    math_operator: ">"
    threshold: 0
    for: 1m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-oomkilled"
      summary: "tatara-operator pod {{ index $labels \"pod\" }} was OOMKilled. Raise the memory limit or investigate a leak."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator container stuck waiting"
    queries:
      - expression: |
          max by (pod, reason) (kube_pod_container_status_waiting_reason{namespace="tatara",pod=~"tatara-operator-.*",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError"})
    math_operator: ">"
    threshold: 0
    for: 10m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-container-stuck-waiting"
      summary: "tatara-operator pod {{ index $labels \"pod\" }} container stuck waiting ({{ index $labels \"reason\" }}). It is not running."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # `or vector(0)` REMOVED (tatara-observability#67). On a FOREIGN exporter's
  # metric with a `<` comparison it fabricates a zero and pages that the operator
  # is down while up{job="tatara-operator"}=1 throughout: kube-state-metrics being
  # unscrapeable is not the operator being unready. The `and on()` gate makes the
  # rule evaluate only while kube-state-metrics is demonstrably reporting; without
  # a gate an absent series would be NoData -> the file default OK, which is a
  # silent blind spot, so "Kube-state-metrics down" below covers that half.
  # Total absence of the operator itself stays covered by "Operator scrape target
  # down", which reads the operator's OWN up series - a fabricated zero THERE is
  # correct, because a vanished self-scrape genuinely is the failure.
  - name: "Operator pod not ready"
    queries:
      - expression: |
          sum(kube_pod_status_ready{namespace="tatara",pod=~"tatara-operator-.*",condition="true"})
            and on() (up{job="kube-state-metrics"} == 1)
    math_operator: "<"
    threshold: 1
    for: 10m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-pod-not-ready"
      summary: "No tatara-operator pod is Ready (sum ready={{ index $values \"C\" }}), while kube-state-metrics is confirmed up. The readiness probe is failing across the Deployment. Total absence of the Deployment itself is covered by \"Operator deployment has no available replicas\" and \"Operator scrape target down\", not by this rule."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # The companion to the gate above. Gating "Operator pod not ready" on
  # kube-state-metrics converts a KSM outage from a false page into a silent blind
  # spot unless the outage itself is alerted - upstream kubernetes-mixin has this
  # exact gap and ships no such rule; we do not want to inherit it. absent() is 1
  # exactly when no `up{job="kube-state-metrics"} == 1` series exists, and empty
  # otherwise -> NoData -> the file default OK.
  - name: "Kube-state-metrics down"
    queries:
      - expression: |
          absent(up{job="kube-state-metrics"} == 1)
    math_operator: ">"
    threshold: 0
    for: 10m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-kube-state-metrics-down"
      summary: "kube-state-metrics is not reporting. Every kube_* -derived tatara alert is blind while this fires, including \"Operator pod not ready\", which is gated on this exporter being up."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Control-loop liveness: the leader emits business metrics only. A wedged or
  # stalled loop shows up as flat scan/reconcile counters across all replicas.
  # ----------------------------------------------------------------------------
  - name: "Operator reconcile loop wedged"
    queries:
      - expression: |
          sum(increase(operator_reconcile_total{namespace="tatara",job="tatara-operator"}[15m])) or vector(0)
    math_operator: "<"
    threshold: 1
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-reconcile-loop-wedged"
      summary: "No reconciles completed across all tatara-operator replicas in 15m (increase={{ index $values \"C\" }}). The controller loop is wedged, or the operator is gone entirely (the `or vector(0)` fallback fires when the reconcile series has vanished)."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  - name: "Operator reconcile error ratio high"
    queries:
      - expression: |
          sum(increase(operator_reconcile_total{namespace="tatara",job="tatara-operator",result="error"}[15m])) / clamp_min(sum(increase(operator_reconcile_total{namespace="tatara",job="tatara-operator"}[15m])), 1)
    math_operator: ">"
    threshold: 0.2
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-reconcile-error-ratio-high"
      summary: "tatara-operator reconcile error ratio is {{ index $values \"C\" }} (>0.20) over 15m. Reconciles are failing en masse."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Agent turn pipeline: submit failures and slow SubmitTurn calls stall agents.
  # ----------------------------------------------------------------------------
  - name: "Operator turn submit failure ratio high"
    queries:
      - expression: |
          (sum(increase(operator_turn_submit_total{namespace="tatara",job="tatara-operator",result="error"}[15m])) / clamp_min(sum(increase(operator_turn_submit_total{namespace="tatara",job="tatara-operator"}[15m])), 1)) and (sum(increase(operator_turn_submit_total{namespace="tatara",job="tatara-operator"}[15m])) >= 10)
    math_operator: ">"
    threshold: 0.3
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-turn-submit-failure-ratio-high"
      summary: "tatara-operator turn-submit error ratio is {{ index $values \"C\" }} (>0.30) over 15m. Agent turns are failing to dispatch to wrappers."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator turn submit p95 latency high"
    queries:
      - expression: |
          histogram_quantile(0.95, sum(rate(operator_turn_submit_duration_seconds_bucket{namespace="tatara",job="tatara-operator"}[15m])) by (le)) and on() (sum(rate(operator_turn_submit_duration_seconds_count{namespace="tatara",job="tatara-operator"}[15m])) > 0)
    math_operator: ">"
    # 6.4, not 30: operator_turn_submit_duration_seconds is ExponentialBuckets(0.05, 2, 10),
    # so histogram_quantile can never return above 25.6 and `> 30` was structurally inert
    # (#111). 6.4 is a real bucket bound, ~8x the observed p95 (flat at 0.78s across 7d,
    # every observation in le="0.8") and 4x under the ceiling.
    threshold: 6.4
    for: 15m
    decimal_points: 1
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-turn-submit-p95-latency-high"
      summary: "tatara-operator SubmitTurn p95 latency is {{ index $values \"C\" }}s (>6.4s) over 15m. Dispatching agent turns is slow; wrappers may be unreachable or saturated."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator agent HTTP failure spike"
    queries:
      - expression: |
          sum(rate(operator_agent_http_total{namespace="tatara",job="tatara-operator",outcome=~"unreachable|timeout|transport_error"}[10m]))
    math_operator: ">"
    threshold: 0.2
    for: 10m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-http-failure-spike"
      summary: "tatara-operator agent-wrapper HTTP failures (unreachable/timeout/transport) at {{ index $values \"C\" }}/s over 10m. Wrappers are unreachable; agents cannot run turns."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator agent boot crash budget exhausted"
    queries:
      - expression: |
          sum by (reason) (increase(operator_agent_boot_crash_total{namespace="tatara",job="tatara-operator",outcome="failed"}[1h]))
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-boot-crash-budget-exhausted"
      summary: "tatara-operator exhausted the wrapper boot-respawn budget {{ index $values \"C\" }} time(s) in 1h (reason={{ index $labels \"reason\" }}). Tasks are failing because wrapper pods never reach /readyz."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # SCM / webhook write health: writeback failures break the agent->repo loop.
  # ----------------------------------------------------------------------------
  - name: "Operator SCM write failure ratio high"
    queries:
      - expression: |
          sum(increase(operator_scm_writes_total{namespace="tatara",job="tatara-operator",result="error"}[15m])) / clamp_min(sum(increase(operator_scm_writes_total{namespace="tatara",job="tatara-operator"}[15m])), 1)
    math_operator: ">"
    threshold: 0.3
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-scm-write-failure-ratio-high"
      summary: "tatara-operator SCM write error ratio is {{ index $values \"C\" }} (>0.30) over 15m. Comments/labels/approvals/PRs are failing to land on GitHub/GitLab."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator webhook error ratio high"
    queries:
      - expression: |
          sum(increase(operator_webhook_events_total{namespace="tatara",job="tatara-operator",result=~"error|bad_signature|bad_request"}[15m])) / clamp_min(sum(increase(operator_webhook_events_total{namespace="tatara",job="tatara-operator"}[15m])), 1)
    math_operator: ">"
    threshold: 0.2
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-webhook-error-ratio-high"
      summary: "tatara-operator webhook error ratio is {{ index $values \"C\" }} (>0.20) over 15m. Inbound SCM events are being rejected; the platform may stop reacting to repo activity."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # THE ERROR-RATIO RULE ABOVE CANNOT SEE THESE. A dropped mirror write happens on the
  # CONTINUE-ON-ERROR path: the webhook still returns 200 to the forge on purpose (a
  # webhook must never fail) and a REST accept still commits its stage transition, so the
  # request counts as a SUCCESS in operator_webhook_events_total while a write silently
  # went missing underneath it. Two of the eight call sites did not even log. The most
  # common root cause is a tatara-memory outage: every objbudget.Fit* write fails by design
  # when the guard cannot spill, so this appears as a burst across many (project, site)
  # series at once rather than as one clean failure.
  # Grouped BY SITE because the consequences are not interchangeable and the responder
  # needs to know which one landed - the summary names the three that actually lose
  # platform behaviour rather than just freshness.
  #
  # PER-SERIES SUBTRACTION, NOT increase(): this counter is not pre-seeded, so a series is
  # created BY its first Inc() with its first sample already =1, and increase() needs two
  # samples in the window to see a delta - it cannot see a counter's own birth. Here the
  # single first occurrence is exactly the event that matters (one lost incident_refire is
  # one suppressed escalation), so increase() would drop the signal this rule exists for.
  # The algebra is spelled out in full on "Tatara agent reported platform problem" below.
  - name: "Operator mirror or webhook writes dropped"
    queries:
      - expression: |
          sum by (project, site) (
            clamp_min(
              operator_mirror_write_dropped_total{namespace="tatara",job="tatara-operator"}
              - (operator_mirror_write_dropped_total{namespace="tatara",job="tatara-operator"} offset 30m
                 or 0 * operator_mirror_write_dropped_total{namespace="tatara",job="tatara-operator"}),
              0
            )
          )
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-mirror-or-webhook-writes-dropped"
      summary: "tatara-operator dropped {{ index $values \"C\" }} best-effort mirror/webhook write(s) at site={{ index $labels \"site\" }} for project {{ index $labels \"project\" }} in 30m. The forge got a 200 and the request looks successful, so no error-ratio rule can see this. Three sites lose platform BEHAVIOUR, not just freshness: site=incident_refire loses the refire counter that escalationDue reads, which SUPPRESSES INCIDENT ESCALATION - a re-firing production alert stops escalating and nothing says so; site=comment_append loses a HUMAN comment from the mirror on a path that still fires the unpark, so the agent is woken by a comment its own bundle does not contain; site=issue_body_title suppresses the derived issue_edited event, so the owning Task never sees the edit at all. The rest (issue_state, mr_refresh, record_bot_head, incident_cooldown_reset, incident_escalate) leave stale mirror state, and the two head-SHA ones can cause a spurious ownership stand-down. Check tatara-memory first: an outage makes every objbudget-guarded write fail at once."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Memory stacks + lightrag: a Failed per-project memory stack DEGRADES its agents.
  # It no longer blocks them - see #470 and the degraded-pod rule below.
  # ----------------------------------------------------------------------------
  - name: "Operator memory stack failed"
    queries:
      - expression: |
          max by (project) (operator_memory_stacks{namespace="tatara",job="tatara-operator",phase="Failed"})
    math_operator: ">"
    threshold: 0
    for: 10m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-memory-stack-failed"
      summary: "The tatara-memory stack for project {{ index $labels \"project\" }} is in phase Failed. Its agents keep spawning and working (#470 removed the spawn gate) but cannot read or write memory, so they run on an empty corpus."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # tatara-operator#470 removed the two memory SPAWN/TURN gates: an unhealthy memory stack
  # no longer holds Tasks, it degrades them. That is the right trade (an unbounded memory
  # outage used to stop the platform instead of slowing it), but it moves a hard failure
  # into a silent quality regression, so the amount of work shipping without recall has to
  # be bounded in time by an alert. The counter is recorded at the spawn site itself
  # (task_stage.go, right after the wrapper Pod Create) rather than depending on the agent
  # noticing it has no recall. subsystem is "memory" and nothing else today.
  #
  # THRESHOLD >1, NOT >0, IS THE ANTI-BLIP DESIGN. MemoryStablyReady requires 3 minutes of
  # continuous Ready, so an ordinary memory restart legitimately degrades whatever spawns
  # inside that window; one such pod is not an incident. Two or more inside an hour means
  # the stack has been unhealthy long enough that real work is going out blind. `for: 15m`
  # then requires that to persist rather than firing on the instant the second pod spawns.
  - name: "Operator agent pods running without memory recall"
    queries:
      - expression: |
          sum by (project, subsystem) (increase(operator_agent_pod_degraded_total{namespace="tatara",job="tatara-operator"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 1
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-pods-running-without-memory-recall"
      summary: "{{ index $values \"C\" }} agent pod(s) for project {{ index $labels \"project\" }} were spawned in the last hour with {{ index $labels \"subsystem\" }} unavailable, so they ran a full turn with NO recall. They are not blocked (that gate was removed in #470) - they are producing output from an empty corpus, which reads as ordinary work and lands as ordinary commits and reviews. Treat the results of those Tasks as suspect. Root cause is the project's memory stack: check \"Memory stack stuck not ready\". Two related consequences fire separately - re-ingest is gated (\"Repository re-ingest gated on memory readiness\") and over-budget status writes are refused (\"Operator status writes blocked by an unspillable eviction batch\")."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator memory retrieval surface absent"
    queries:
      - expression: |
          sum by (route) (increase(operator_memory_retrieval_probe_total{namespace="tatara",job="tatara-operator",result="absent"}[30m]))
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-memory-retrieval-surface-absent"
      summary: "tatara-operator probed {{ index $values \"C\" }} tatara-memory retrieval routes as absent (404) in 30m. A memory binary has drifted/regressed; route {{ index $labels \"route\" }} is gone."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # Sibling of the memory-retrieval probe: the operator's synthetic probe of
  # whether agents can actually reach the operator-write tool backend and the
  # chat tool backend. result ok|present are HEALTHY (present = route+auth
  # reachable, 401/403); absent|error|unreachable are the real failures (route
  # drift / broken 5xx handler / process down). Excluding ok|present is required.
  - name: "Operator tool-surface probe failing"
    queries:
      - expression: |
          sum by (backend) (increase(operator_tool_surface_probe_total{namespace="tatara",job="tatara-operator",result=~"absent|error|unreachable"}[30m]))
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-tool-surface-probe-failing"
      summary: "tatara-operator probed the {{ index $labels \"backend\" }} tool backend as failing (absent/error/unreachable) {{ index $values \"C\" }} times in 30m. Agents may have lost access to that tool surface."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Task throughput + queue: saturated lanes and terminal failures stall the loop.
  # ----------------------------------------------------------------------------
  # Concurrency gates AGENT PODS, not Tasks (contract A.6). Tasks are long-lived
  # scaffolding - one parked for 24h is HEALTHY and costs nothing - which is why
  # operator_tasks_inflight is gone.
  #
  # REWRITTEN 2026-08-08 (#95). THE OLD SHAPE WAS WRONG IN BOTH DIRECTIONS AND THE
  # REPLACEMENT DELIBERATELY CARRIES NO CAPACITY CONSTANT AT ALL.
  #
  # It was: sum(<every wrapper pod in the namespace>) > 5.999, where 5.999 was hand-copied
  # from "2 projects x maxConcurrentAgents: 3" in tatara-helmfile, with a comment demanding
  # anyone who bumps that value also bump this one. Nothing enforced that, and it was
  # ALREADY FALSE on the day it was authored (2026-07-13: maxConcurrentAgents had been 5
  # since 07-04). By 2026-08-01 the real sum-of-caps was 12 across three projects.
  #
  # Worse than stale: admission is enforced PER (project, class), so a namespace-wide sum
  # is not a function of any lane's saturation and can neither confirm nor deny it. On
  # 2026-08-01 the tatara alert lane sat pinned at its cap for 13.5h with a 4-5 event
  # backlog and ~63 refused admissions/hour while this rule stayed SILENT (two other
  # projects happened to be idle), then fired at 09:58 - after the backlog had SHRUNK -
  # because unrelated projects pushed the namespace total over 6. Its summary named the
  # webhook/sweep lane, which had queue depth 0 at every sample; 100% of the 286 refusals
  # were class=alert.
  #
  # THE REPLACEMENT MEASURES THE REFUSAL, NOT A PROXY FOR IT.
  # operator_admission_blocked_total{reason="pool_full"} is emitted by the admission path
  # itself, at most once per pool per pass and ONLY when work was genuinely left Queued
  # behind a full pool (#440). It is labelled {project,class,kind,reason}, so it already
  # knows the cap without anyone writing the cap down - whether that cap is
  # queue.alertCapacity (class=alert) or maxConcurrentAgents (the project lane) is the
  # operator's business, not this file's. There is nothing left to drift.
  #
  # The `and on (project, class)` term keeps the original rule's intent (a full pool with
  # nothing waiting is throughput, not starvation) but applies it PER LANE instead of
  # namespace-wide, which is what the old rule got wrong.
  #
  # for: 30m + a 30m increase() window means one refusal spike cannot page: the lane has
  # to keep refusing admissions, with work still queued, for half an hour.
  #
  # Companion, not duplicate: "Operator queue depth backlog" watches the same (project,
  # class) lanes for DEPTH > 10 regardless of whether anything is being refused. A lane can
  # be refusing steadily at depth 3 (which is this rule) or backing up without refusals
  # (which is that one).
  - name: "Operator agent pod pool saturated with queued work"
    queries:
      - expression: |
          (sum by (project, class) (increase(operator_admission_blocked_total{namespace="tatara",job="tatara-operator",reason="pool_full"}[30m])) > 0)
          and on (project, class)
          (max by (project, class) (operator_queue_depth{namespace="tatara",job="tatara-operator"}) > 0)
    math_operator: ">"
    threshold: 0
    for: 30m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-pod-pool-saturated-with-queued-work"
      summary: "The {{ index $labels \"project\" }} / class={{ index $labels \"class\" }} admission lane refused {{ index $values \"C\" }} admission(s) with reason=pool_full in 30m while QueuedEvents were still waiting, and has done so for 30m. THAT LANE is saturated and its work is starved - no other lane is implicated, and the namespace-wide pod count says nothing about it. The binding cap is queue.alertCapacity for class=alert and maxConcurrentAgents for the project lane, both set per project in tatara-helmfile values/project-*/common.yaml. Confirm the lane and its backlog directly: max by (project, class) (operator_queue_depth{namespace=\"tatara\"}) and max by (project, class, state) (operator_queue_age_seconds{namespace=\"tatara\"}). If the lane is class=alert, incident investigations are queueing behind each other, which is a capacity call (they run for tens of minutes each), not a bug."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # CROSS-REPO DEPENDENCY D1 IS RESOLVED, AND NOT THE WAY THIS COMMENT USED TO ASSUME
  # (#97, 2026-08-08). operator_task_terminal_total DID survive, now labelled
  # {kind,state,stateReason} - verified in tatara-operator internal/obs/task_metrics.go:42-45
  # at origin/main. But #521 NARROWED IT: `failed` and `parked` are no longer states, the
  # terminal set is EXACTLY {done, rejected}, "a failure now PARKS, and
  # operator_task_parked_total is where a park is counted" (the counter's own Help text).
  #
  # So {stage="failed"} did not just change spelling, it stopped existing. This rule is
  # re-expressed on the park counter, which is the only counter of a failure the platform
  # still has. The exclusion set is the four reasons that are NOT a platform failure or
  # that another rule owns:
  #   backlog-sweep   - the zero-cost mint path that OWNS a backlog issue, spawns no pod
  #   awaiting-human  - a human not having replied yet
  #   merge-timeout   - owned by "Tatara delivery parked on a merge or deploy timeout"
  #   deploy-timeout    (alerts/tatara-cd.yaml, severity critical, threshold 0)
  # Splitting by parkReason is what makes it actionable: stage-deadline is a budget problem,
  # admission-starved is a capacity problem, agent-contract-mismatch is a skewed release
  # train.
  #
  # THE MATCHER IS NEGATIVE, AND THAT IS WHY PHASE O3 DOES NOT DARKEN THIS RULE. O3 deletes
  # the enforcement behind turn-budget-exhausted, review-loop-exhausted and
  # pod-recreation-exhausted, so all three stop being emitted. A POSITIVE matcher on any of
  # them would then match nothing and report OK forever - that is what happened to
  # "Operator task pod-recreation budget exhausted", which is why the rule above replaces
  # it with a counter that survives. An EXCLUSION list has the opposite failure mode: the
  # three simply stop contributing and every other parkReason is still counted, so no edit
  # is needed here and none was made. The three literals stay in stage.ParkReasons and in
  # scripts/stage_values_allowlist.txt regardless - removing an enum member breaks
  # validation on the next status write of every Task already parked with one.
  #
  # KNOWN, DELIBERATE OVERLAP with "Operator task park spike" further down this file, which
  # is the same counter over a 3h window excluding only the two benign reasons. #521
  # collapsed `failed` and `parked` into one counter, so a burst detector and a
  # sustained-trickle detector on it cannot be made disjoint without inventing a
  # distinction the operator no longer draws. The pairing is the same shape as
  # "Tatara operator error log burst" (5m) / "Tatara operator error recurring" (1h) in
  # alerts/tatara-logs.yaml: 1h/>3 is the burst, 3h/>3 is the trickle. Do not "dedupe"
  # them by deleting one - see MEMORY.md 2026-08-08.
  - name: "Operator task failure spike"
    queries:
      - expression: |
          sum by (parkReason) (increase(operator_task_parked_total{namespace="tatara",job="tatara-operator",parkReason!~"backlog-sweep|awaiting-human|merge-timeout|deploy-timeout"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 3
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-task-failure-spike"
      summary: "{{ index $values \"C\" }} park event(s) with parkReason={{ index $labels \"parkReason\" }} in 1h (>3). Under the v2.0.0 lifecycle a failure PARKS rather than terminating - `failed` is not a state any more - so this is the failure-rate signal. Parks are transitions, not distinct Tasks: a park/un-park flap on one Task counts several times, so read it as an upper bound. The Task CRs are still there and still un-parkable: kubectl get tasks -n tatara -o custom-columns=NAME:.metadata.name,STATE:.status.state,PARK:.status.parkReason."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator queue depth backlog"
    queries:
      - expression: |
          max by (project, class) (operator_queue_depth{namespace="tatara",job="tatara-operator"})
    math_operator: ">"
    threshold: 10
    for: 30m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-queue-depth-backlog"
      summary: "tatara-operator queue depth is {{ index $values \"C\" }} (>10) for project {{ index $labels \"project\" }} class {{ index $labels \"class\" }}. QueuedEvents are backing up faster than they admit."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Token/$ spend: model- and cache-aware runaway detection over the durable
  # operator_task_tokens_total metric (durable-measurement design, review G17).
  #
  # COVERAGE GUARD: the `model`/`type=cache_read|cache_creation` label set below
  # is produced by the operator's durable-measurement work (tatara-operator
  # AddTaskTokens model/cache args, shipped in tatara-operator #220). The
  # coverage-gap rule directly below guards against a schema REGRESSION: the
  # operator emitting operator_task_tokens_total series WITHOUT the model/cache
  # labels (the pre-#220 state), which would silently blind the "$/s" detector.
  #
  # It must NOT fire on ordinary idleness: operator_task_tokens_total is an
  # ephemeral per-task counter (series are lazily created on the first
  # token-bearing turn and deleted on task GC by the reaper), so the whole
  # selector is legitimately empty whenever the fleet is idle or cold-starting.
  # A raw absent() therefore pages on every quiet period. The rule below is
  # gated on `count(operator_task_tokens_total) > 0` so it only fires when the
  # operator IS emitting token series but none carry the model/cache labels -
  # the real regression - and stays silent (NoData -> OK) when idle.
  # ----------------------------------------------------------------------------
  - name: "Agent token spend runaway series missing (coverage gap)"
    queries:
      - expression: |
          (count(operator_task_tokens_total) > 0)
          and
          absent(operator_task_tokens_total{model=~".+", type=~"input|output|cache_read|cache_creation"})
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-agent-token-spend-runaway-series-missing-coverage-gap"
      summary: "operator_task_tokens_total is being emitted but NO series carry the model/cache-aware labels (model + type=input|output|cache_read|cache_creation) for 15m, while token series ARE present. The operator's model/cache token schema (tatara-operator #220) has regressed, so the 'Agent token spend runaway ($/s)' rule below has no data source and CANNOT detect a runaway. This rule is gated on token activity, so it does NOT fire on an idle fleet - if it is firing, the operator token-metric labelling is broken. Check AddTaskTokens model/cacheRead/cacheCreation args in tatara-operator."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Agent token spend runaway ($/s)"
    queries:
      - expression: |
          sum(
              rate(operator_task_tokens_total{type="input",          model=~"claude-opus-4-8|claude-opus-5"}[15m]) * 5e-6
           or rate(operator_task_tokens_total{type="output",         model=~"claude-opus-4-8|claude-opus-5"}[15m]) * 25e-6
           or rate(operator_task_tokens_total{type="cache_read",     model=~"claude-opus-4-8|claude-opus-5"}[15m]) * 0.5e-6
           or rate(operator_task_tokens_total{type="cache_creation", model=~"claude-opus-4-8|claude-opus-5"}[15m]) * 6.25e-6
           or rate(operator_task_tokens_total{type="input",          model="claude-sonnet-5"}[15m]) * 3e-6
           or rate(operator_task_tokens_total{type="output",         model="claude-sonnet-5"}[15m]) * 15e-6
           or rate(operator_task_tokens_total{type="cache_read",     model="claude-sonnet-5"}[15m]) * 0.3e-6
           or rate(operator_task_tokens_total{type="cache_creation", model="claude-sonnet-5"}[15m]) * 3.75e-6
           or rate(operator_task_tokens_total{type="input",          model="claude-haiku-4-5"}[15m]) * 1e-6
           or rate(operator_task_tokens_total{type="output",         model="claude-haiku-4-5"}[15m]) * 5e-6
           or rate(operator_task_tokens_total{type="cache_read",     model="claude-haiku-4-5"}[15m]) * 0.1e-6
           or rate(operator_task_tokens_total{type="cache_creation", model="claude-haiku-4-5"}[15m]) * 1.25e-6
          )
    math_operator: ">"
    threshold: 0.5
    for: 15m
    decimal_points: 3
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-agent-token-spend-runaway-s"
      summary: "Agents spending {{ index $values \"C\" }} USD/s over 15m (>$0.50/s, model-aware). A turn or loop is burning budget; check the task-delivery Cost panel."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Agent turn-execution + boot failure paths: stalled turns and never-reachable
  # wrappers destroy work terminally. Distinct from the SubmitTurn RPC rules
  # (dispatch side) and the boot-crash-budget rule (pod never reaches /readyz).
  # ----------------------------------------------------------------------------
  - name: "Operator agent turn timeout spike"
    queries:
      - expression: |
          sum(increase(operator_turn_timeout_total{namespace="tatara",job="tatara-operator"}[1h]))
    math_operator: ">"
    threshold: 5
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-turn-timeout-spike"
      summary: "tatara-operator terminated {{ index $values \"C\" }} agent turn(s) for stalling in 1h (>5). Turns are exceeding the inactivity deadline (wedged model session or wrapper hang), burning budget and blocking Tasks. Operator-side turn-execution stall detector (across sources reconcile|poll_backstop|planning_watchdog), distinct from the SubmitTurn RPC latency rule."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator agent unreachable terminations"
    queries:
      - expression: |
          sum(increase(operator_agent_unreachable_termination_total{namespace="tatara",job="tatara-operator"}[1h]))
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-unreachable-terminations"
      summary: "tatara-operator terminated {{ index $values \"C\" }} Task(s) in 1h because the wrapper stayed unreachable past the boot deadline. A pod that booted but never became network-reachable killed the Task and wasted the work; a systemic pod-networking/CNI fault would otherwise go unnoticed. Distinct from the boot-crash-budget rule (pod never reached /readyz)."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # REPLACES "Operator task pod-recreation budget exhausted", which keyed on
  # operator_task_parked_total{parkReason="pod-recreation-exhausted"} - a POSITIVE matcher
  # on a park reason the operator stops emitting at phase O3, when the maxPodRecreations
  # cap is deleted. A positive matcher on a dead value matches nothing and, with
  # default_no_data_state: "OK", reports OK forever: exactly the silent-green class
  # check_metric_provenance.py exists to catch. It is removed here rather than at O3 so the
  # successor is watching BEFORE the cap it replaces goes away, not after.
  #
  # THE CAP IS NOT BEING REPLACED BY ANOTHER CAP. O3's premise is "TTL always decides" - no
  # feature exceeds the 24h residency cap and nothing else terminates work early. The
  # accepted, explicit cost (owner decision 2026-08-09) is that a boot-crash loop is then
  # bounded only by that 24h cap: ~288 pods at a 5-minute respawn cycle, which is STRICTLY
  # WORSE than the maxPodRecreations behaviour it replaces. No backstop cap was added. This
  # alert is the entire mitigation, which is why it is CRITICAL while the park rule it
  # replaces was a warning - it has to page, not accumulate.
  #
  # operator_pod_recreations_total{project,kind} (tatara-operator #575,
  # internal/obs/stall_metrics.go:72) counts all three respawn paths: a live pod that ended
  # with no agent handoff (livepods.go:198), a pod lost mid-state (podwatch.go:241), and a
  # pod that never became Ready inside podReadyTimeout (task_stage.go:1456). Deliberately
  # NOT labelled by task, so this is a project rate signal and not a per-Task budget - the
  # per-Task budget is the thing being deleted.
  #
  # RESIDUAL GAP, stated rather than papered over: until O3 lands, a SINGLE Task can still
  # spend the default maxPodRecreations of 3 and park without reaching 6/h here. That case
  # is still counted by "Operator task failure spike" (1h) and "Operator task park spike"
  # (3h), both of which match parkReason NEGATIVELY and therefore still see
  # pod-recreation-exhausted today and simply stop seeing it once O3 stops emitting it.
  # Neither goes dark at O3, and neither needed an edit for it.
  - name: "Operator agent pod recreation loop"
    queries:
      - expression: |
          sum by (project) (increase(operator_pod_recreations_total{namespace="tatara",job="tatara-operator"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 6
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-pod-recreation-loop"
      summary: "Project {{ index $labels \"project\" }} recreated {{ index $values \"C\" }} agent pod(s) in 1h (>6). This is the replacement for the maxPodRecreations cap, and it is the ONLY bound on pod churn once phase O3 removes that cap - an unattended crash loop runs to the 24h residency cap, ~288 pods at a 5-minute cycle. Split by the three recreation paths before acting, they need different fixes: a pod that never becomes Ready is a boot failure (bad image pin, missing secret, bootstrap clone failing - check the wrapper --previous log); a pod lost mid-state is node-level (eviction, memory pressure, OOM-kill); a live pod that ended with no agent handoff is the path most likely to loop indefinitely, since nothing about it is self-limiting. Break it down with sum by (project, kind) (increase(operator_pod_recreations_total[1h]))."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # THE PROBE IS A DIAGNOSIS, NOT A TIMEOUT, AND THE TWO OUTCOMES MEAN DIFFERENT THINGS.
  # operator_stall_probe_total{outcome} (tatara-operator #575/#577,
  # internal/obs/stall_metrics.go:48) takes exactly six values:
  # sent|answered|unanswered|never_delivered|unsupported|error. Only two of them are
  # selected here and the split is the whole point:
  #
  #   never_delivered - the probe text was written onto the PTY and the session logged its
  #     `queue-operation` enqueue line immediately, but no matching remove/dequeue ever
  #     followed. Delivery happens at the NEXT TOOL-CALL BOUNDARY, so this is a positive
  #     statement about where the agent is: blocked inside ONE long-running tool call. It
  #     is not "the wrapper is unresponsive" and it is not "the model is slow" (measured: a
  #     70s sleep buffered a probe 58.2s and it was then delivered normally).
  #   unanswered - the probe WAS delivered, a tool-call boundary was reached, and no
  #     TATARA-ALIVE reply came back inside stallProbeGraceSeconds. Much weaker: a busy turn
  #     legitimately declines to answer.
  #
  # DELIBERATELY EXCLUDED: `sent` is the denominator (every probe increments it), `answered`
  # is the healthy case, `unsupported` means the pod runs a pre-probe wrapper build and the
  # operator fell back to the old stall handling - a rollout-skew signal, not a stall - and
  # `error` is a transport failure that the agent-HTTP rules already own. Grouping by
  # outcome keeps the two diagnoses in separate alert instances rather than summing two
  # unrelated failures into one threshold.
  #
  # Neither outcome kills a turn on its own: the operator probes, waits
  # stallProbeGraceSeconds, re-probes, and only past stallProbeMaxAttempts interrupts and
  # runs the ordinary stop sequence. So this reports the escalation path being exercised,
  # not work already lost - hence warning, and hence a 1h window rather than any occurrence.
  - name: "Operator agent stall probe unanswered"
    queries:
      - expression: |
          sum by (outcome) (increase(operator_stall_probe_total{namespace="tatara",job="tatara-operator",outcome=~"unanswered|never_delivered"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 3
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-stall-probe-unanswered"
      summary: "{{ index $values \"C\" }} stall probe(s) with outcome={{ index $labels \"outcome\" }} in 1h (>3). Read the outcome, they are different diagnoses: never_delivered means the probe's enqueue line was written and no remove followed, i.e. the agent never reached another tool-call boundary and IS BLOCKED INSIDE ONE LONG-RUNNING TOOL CALL (an MCP or forge call with no client timeout, a command waiting on a prompt, a shell read from an empty stdin) - the wrapper is fine and the session is intact. unanswered means the probe was delivered and simply not replied to inside stallProbeGraceSeconds, which a busy turn does legitimately; treat a rising unanswered rate with no never_delivered alongside as the grace window being too tight, not as a hang. `kubectl exec <pod> -c wrapper -- ps -eo pid,etimes,args --sort=-etimes` names the hung tool call outright."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # WHETHER RAISING THE CEILING BOUGHT ANYTHING. A human event arrived for a Task that would
  # have been taken live - a reply on an issue or an MR, the thing a live pod exists to
  # answer - and the operator refused because the project was already at maxLivePods. The
  # event is not lost, the Task waits; but this is the most expensive latency the platform
  # produces, because a human was at the keyboard when it happened. MaxLivePods clamps to
  # maxConcurrentAgents-1, so an agent-ceiling raise that does not move maxLivePods buys the
  # live lane nothing - if these refusals do not fall across the H1b raise, the raise did
  # not reach live work.
  #
  # reason="live-ceiling-full" IS THE ONLY SATURATION VALUE, verified against
  # tatara-operator internal/controller/livepods.go:907-931 (LiveEntryDeclineReasons). The
  # closed set is not-a-live-state|task-parked|live-ceiling-full|rounds-exhausted|task-done,
  # and the other four are ordinary refusals - not-a-live-state alone runs ~85/week and
  # would swamp any threshold set here.
  #
  # "no-live-room" IS NOT A VALUE OF THIS LABEL, and the plan this rule came from assumed it
  # was. It is stage.DeclineNoLiveRoom (internal/stage/stage.go:1169) and it lands on the
  # KIND label of operator_unpark_declined_total - the same live ceiling refusing a PARKED
  # Task that a human event would have woken, one door over. Deliberately not folded in
  # here: different metric, different label, different label set, and `kind` is a closed-set
  # label in stage_values_allowlist.txt that would need an exemption. The runbook names it
  # so an on-call checks both; neither rule can see the other's refusals.
  - name: "Operator live entry blocked"
    queries:
      - expression: |
          sum by (project) (increase(operator_live_entry_declined_total{namespace="tatara",job="tatara-operator",reason="live-ceiling-full"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 10
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-live-entry-blocked"
      summary: "Project {{ index $labels \"project\" }} refused {{ index $values \"C\" }} live entries in 1h (>10) with reason=live-ceiling-full - human events arriving for Tasks that would have gone live, turned away because the project is at maxLivePods. Work is not lost, but a person was waiting. Check first whether the live pods holding the ceiling are serving live conversations or merely sitting inside their conversation-idle budget with nobody talking to them: if it is the latter, the idle budget is the knob, not the ceiling. If they are genuinely busy this is a capacity call - raise maxLivePods (and maxConcurrentAgents with it, since maxLivePods clamps to maxConcurrentAgents-1) in tatara-helmfile values/project-*/common.yaml, knowing it raises the ceiling on concurrent model spend too. The un-park side of the same ceiling is counted separately as operator_unpark_declined_total{kind=\"no-live-room\"}; check it alongside."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Inbound REST API + auth: agent turn callbacks/writebacks land on the operator
  # REST API (patch_task, propose_issue, *_outcome, post_comment, handover).
  # Auth rejections are info-only (email, no system=tatara label -> no incident
  # Task) so a credential typo does not raise an emergency-brainstorm.
  # ----------------------------------------------------------------------------
  - name: "Operator REST API error ratio high"
    queries:
      - expression: |
          (sum(increase(operator_restapi_requests_total{namespace="tatara",job="tatara-operator",result="error"}[15m])) / clamp_min(sum(increase(operator_restapi_requests_total{namespace="tatara",job="tatara-operator"}[15m])), 1)) and (sum(increase(operator_restapi_requests_total{namespace="tatara",job="tatara-operator"}[15m])) >= 10)
    math_operator: ">"
    threshold: 0.1
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-rest-api-error-ratio-high"
      summary: "tatara-operator inbound REST API error ratio is {{ index $values \"C\" }} (>0.10) over 15m. Agent turn callbacks/writebacks (patch_task, propose_issue, *_outcome, post_comment, handover) are failing to land (5xx or Task-gone 404 on the internal-failure path; 4xx validation rejections are not counted as error)."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # Invisible to the error-ratio rule above, deliberately: task_context?notes=all now
  # serves the notes it HAS instead of 502-ing the whole response when a spilled batch
  # cannot be read back from tatara-memory. That is the right call for availability, and
  # it means the request is counted as a SUCCESS while the agent silently receives a
  # shorter history than it asked for - with nothing in the response saying so. This
  # counter is the only signal that it happened.
  # Same non-pre-seeded counter-birth problem as the mirror rule above, same fix; note the
  # value is a count of NOTE BATCHES (one call site Adds len(refs), not 1), so it reads
  # high relative to the number of requests affected.
  - name: "Operator task context served with missing notes"
    queries:
      - expression: |
          sum by (project) (
            clamp_min(
              operator_restapi_notes_rehydrate_failed_total{namespace="tatara",job="tatara-operator"}
              - (operator_restapi_notes_rehydrate_failed_total{namespace="tatara",job="tatara-operator"} offset 30m
                 or 0 * operator_restapi_notes_rehydrate_failed_total{namespace="tatara",job="tatara-operator"}),
              0
            )
          )
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-task-context-served-with-missing-notes"
      summary: "tatara-operator could not rehydrate {{ index $values \"C\" }} spilled note batch(es) for project {{ index $labels \"project\" }} in 30m, so task_context?notes=all served a PARTIAL history and returned 2xx. Agents asking for their full note history are getting a truncated one with no indication in the response; any turn that reasoned over it reasoned over less than it believed. Usually a tatara-memory outage (check \"Memory stack stuck not ready\" for this project); if memory is healthy the spilled batch is permanently unreadable and the notes are gone."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator auth rejections elevated"
    queries:
      - expression: |
          sum(rate(operator_auth_total{namespace="tatara",job="tatara-operator",result=~"missing_token|invalid_scheme|invalid_token|rejected"}[10m]))
    math_operator: ">"
    threshold: 1
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-auth-rejections-elevated"
      summary: "Operator REST API rejecting auth at {{ index $values \"C\" }}/s (missing/invalid/rejected tokens) for 15m. Possible misconfigured wrapper token, expired credential, or probing. Info-only (no system=tatara label): emails, does not raise an incident Task."
    labels:
      homelab: "true"
      component: "operator"
      severity: "info"
  # ----------------------------------------------------------------------------
  # Wrapper metric-push pipeline: wrapper pods have NO scrape target, so every
  # ccw_* series reaches Prometheus only via HTTP push to the operator receiver.
  # A push rejection or a fully dark receiver silently blinds all ccw_* alerts
  # (several of which use clamp_min/or vector(0) and stay green when blind).
  # ----------------------------------------------------------------------------
  - name: "Operator push receiver rejecting wrapper metrics"
    queries:
      - expression: |
          sum(increase(operator_push_receive_total{namespace="tatara",job="tatara-operator",result=~"rejected|too_large"}[15m]))
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-push-receiver-rejecting-wrapper-metrics"
      summary: "tatara-operator push receiver rejected {{ index $values \"C\" }} wrapper metric pushes (rejected/too_large) in 15m. Wrapper pods have no scrape target, so all ccw_* series arrive only via this push; rejections silently blind every ccw_* alert."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # Fleet-wide backstop: aggregate across all 3 replicas. Each replica runs its own
  # in-memory receiver so pushed runs are LB-distributed. Per-instance matching would
  # false-fire on any replica the LB routes zero pushes to.
  # "Agents running" is now the AGENT POD COUNT (kube-state-metrics), not the Task count:
  # Tasks are long-lived and podless for most of their life (contract A.6/F.4), so
  # operator_tasks_inflight both disappeared and would have been the wrong signal.
  - name: "Wrapper metrics blind while agents running"
    queries:
      - expression: |
          ((sum(kube_pod_container_status_running{namespace="tatara",container="wrapper"}) or vector(0)) > 0) * (sum(operator_pushed_runs{namespace="tatara",job="tatara-operator"}) == bool 0)
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-metrics-blind-while-agents-running"
      summary: "{{ index $values \"C\" }} agent pod(s) are running but the entire operator fleet pushed zero wrapper metric runs for 15m. The ccw_* metric-push pipeline is dark while agents are running, so every wrapper alert (turns erroring, commit/push fail, http 5xx, panics) is silently blind."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Slow leaks + per-project budget ceiling. Both are wired-but-quiet (0 series
  # today): the reaper-error metric emits only on a delete failure, the
  # token-budget gauge only once a project enables a budget window.
  # ----------------------------------------------------------------------------
  - name: "Operator orphan reap delete errors"
    queries:
      - expression: |
          sum(increase(operator_reap_delete_error_total{namespace="tatara",job="tatara-operator"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-orphan-reap-delete-errors"
      summary: "tatara-operator backstop reaper failed to delete orphan wrapper resources {{ index $values \"C\" }} time(s) in 1h. Orphans are accumulating (control-plane node pressure / cost leak); the success-side operator_orphan_reaped_total does not surface this. The `or vector(0)` keeps the series defined while the metric is wired-but-quiet."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # Compares scope=used against the per-project emitted scope=emergency threshold
  # (drift-proof: no hardcoded ratio, tracks DefaultEmergencyPercent). The >=
  # join returns the used ratio for any project at/over its emergency ceiling, so
  # `> 0` fires only then. 0 series until a project sets budgetCfg.Enabled.
  - name: "Project token budget riding emergency ceiling"
    queries:
      - expression: |
          max by (project) (operator_token_budget_used_ratio{namespace="tatara",job="tatara-operator",scope="used"}) >= on(project) max by (project) (operator_token_budget_used_ratio{namespace="tatara",job="tatara-operator",scope="emergency"})
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-project-token-budget-riding-emergency-ceiling"
      summary: "Project {{ index $labels \"project\" }} token-budget used ratio {{ index $values \"C\" }} has reached its own configured emergency spawn-pause threshold for 15m. Further agent spawns for the project are being paused. Distinct from the account-wide usage-gate alerts and the fleet $/s runaway rule."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # State machine (contract F.4), REPOINTED 2026-08-08 onto tatara-operator v2.0.0 (#97).
  # THE INVARIANT: no state may be entered without a deadline that leaves it. These rules
  # do NOT enforce a business SLA - the operator's own deadline machinery does that. They
  # fire when a Task sits PAST its budget, which means the deadline machinery itself is
  # broken.
  #
  # WHAT v2.0.0 (#521) CHANGED, and it is not a rename you can find-and-replace:
  #   - status.stage -> status.state, 16 stages -> 8 states: new, refined,
  #     under-implementation, awaiting-review, merged, deployed, done, rejected.
  #     operator_task_stage{_age_seconds} -> operator_task_state{_age_seconds}.
  #   - `parked` and `failed` are NO LONGER STATES. Park is an ORTHOGONAL FLAG
  #     (status.parkReason), liveness is a PROPERTY (stage.Live(state)). A failure PARKS.
  #   - Work-clock budgets (internal/stage/stage.go:640): new 5m, the three LIVE states
  #     (refined, under-implementation, awaiting-review) run the conversation IDLE clock
  #     (60m default) with a single absolute residency cap of 24h, merged 4h, deployed 2h,
  #     done 48h, rejected 24h.
  #
  #     THE THREE LIVE CAPS COLLAPSE TO ONE 24h (phase O3, liveness.go:157-162). They were
  #     24h refined / 6h under-implementation / 4h awaiting-review; they become 24h for all
  #     three, as a CONSTANT and not a CRD field, because "no feature exceeds 24h ever" is a
  #     platform invariant and a constant cannot be silently pruned. Recorded here because
  #     the state-age rules below cite the caps in their own reasoning and a stale 6h/4h
  #     claim is how a threshold gets "harmonised" down onto a cap that no longer exists.
  #     NO THRESHOLD MOVES FOR IT: operator_task_state_age_seconds resets on every state
  #     transition, so the per-state worst case is that state's own cap, never their sum -
  #     4h -> 24h on awaiting-review raises the healthy ceiling to the same ~48h the
  #     refined path already had, which the 8d threshold below already clears.
  #
  # THE CONSEQUENCE FOR EVERY STATE-AGE RULE BELOW, AND IT IS STRUCTURAL:
  # operator_task_state_age_seconds is labelled {task,state,kind} ONLY. It carries NO park
  # dimension, and updateTaskStageGauges emits it for EVERY Task with a state, parked or
  # not (project_controller.go:820-833). A parked Task's only remaining deadline is
  # ParkRetention (7d), and parked(backlog-sweep) is F.4's ONE deadline exemption - it
  # NEVER ages out at all (stage.ArmedClock, stage.go:729-737). So a state-age rule can no
  # longer distinguish "wedged" from "legitimately parked", and any threshold below 7d
  # false-fires on ordinary parked Tasks. Where a rule could be re-expressed on a counter
  # it was; where it could not, the threshold was raised past ParkRetention or the rule was
  # paused. Restoring the old precision needs a `parked`/`parkReason` label on
  # operator_task_state_age_seconds, which the operator does NOT emit today.
  # ----------------------------------------------------------------------------
  # The incident-starvation rule keys on the admission queue itself, not on
  # stage="triaging": triaging's own budget is 5m -> failed(triage-stalled) (F.4), so a
  # Task literally cannot SIT in triaging for 15m and a stage-age rule there could never
  # fire (fix M20). operator_queue_age_seconds carries project,class,priority,state (K.1
  # addendum 8, project added in #457/#458); class=alert is the incident pool (B.7).
  #
  # PRIORITY FILTER NOW TIGHTENED (it was left open "pending verification"). Verified
  # against tatara-operator main: internal/queue/enqueue.go gives a class=alert event
  # Spec.Priority 0 and everything else 2 when the caller does not override, and
  # project_controller.go labels the gauge with strconv.Itoa(EffectiveQueuePriority(...)),
  # so the incident value is the literal string "0". Filtering on it means a
  # non-incident event that somehow lands in the alert pool cannot page this rule.
  #
  # THE SUPPRESSION TERM REPLACES A CLAIM THAT IS NO LONGER TRUE. The old summary argued
  # a queued incident "CANNOT be waiting on the normal pool" because AlertCapacity
  # reserves a slot. That reasoning held when AlertCapacity was effectively 1 - one
  # incident, one reserved slot, so queueing meant broken. It is now configured to 3 on
  # all three projects (the operator's own fallback default is still 1, Project.
  # AlertCapacity()), so three concurrent incidents legitimately fill the reserved pool and a
  # fourth waits: ordinary saturation, not a wedge. operator_admission_blocked_total
  # {class="alert",reason="pool_full"} is emitted (at most once per pool per pass, and
  # only when work was genuinely left Queued behind a full pool - #440) exactly in that
  # case, so `unless on()` drops this rule to NoData -> OK while the pool is honestly
  # full, and lets it fire only when an incident is queued behind a pool that is NOT at
  # capacity - which is the genuine wedge.
  # increase() cannot see that counter's birth (it is not pre-seeded), but on THIS side
  # that blind spot is harmless: pool_full re-increments on every dispatcher pass while
  # work stays queued, so the gap is at most one evaluation, and a single unsuppressed
  # evaluation cannot satisfy `for: 2m` on its own.
  - name: "Operator incident starved in triage"
    queries:
      - expression: |
          (max(operator_queue_age_seconds{namespace="tatara",job="tatara-operator",class="alert",priority="0",state="Queued"}) or vector(0))
          unless on()
          (sum(increase(operator_admission_blocked_total{namespace="tatara",job="tatara-operator",class="alert",reason="pool_full"}[10m])) > 0)
    math_operator: ">"
    threshold: 300
    for: 2m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-incident-starved-in-triage"
      summary: "The oldest queued incident (class=alert, priority=0) has been waiting {{ index $values \"C\" }}s (>5m) in state=Queued while the alert pool is NOT reporting itself full. AlertCapacity is 3, so three incidents in flight and a fourth waiting is legitimate saturation - and that case is suppressed here by operator_admission_blocked_total{class=\"alert\",reason=\"pool_full\"}. This firing means the incident is queued behind a pool with room: priority admission is broken, or the whole triage path is wedged. A firing production alert is not being worked."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # #97: `triaging` became `new`, but a state-age rule on `new` is NOT the successor and
  # would false-fire permanently. state=new is also where the sweep mints every backlog
  # owner as parked(backlog-sweep), which by design never ages out - 6 such Tasks were
  # sitting in state=new at 38065s each when this was verified live on 2026-08-08, so
  # ANY age threshold here fires forever. The gauge carries no park dimension to exclude
  # them with (see the block comment above).
  #
  # Re-expressed on the COUNTER instead, which has no such ambiguity: triage-stalled is
  # the F.4 exit from `new` when its 5m budget elapses (stage.go:656, onElapse[StateNew]
  # = park(triage-stalled)), and operator_task_parked_total is the only counter of it.
  # Polarity is inverted versus the old rule - it now reports triage ACTUALLY stalling
  # rather than the deadline machinery failing to stall it - and that is the actionable
  # half; the "no deadline is running at all" assertion is carried by "Operator pod
  # stage wedged" below, which is the one rule that can still make it.
  - name: "Operator triage stage wedged"
    queries:
      - expression: |
          sum (increase(operator_task_parked_total{namespace="tatara",job="tatara-operator",parkReason="triage-stalled"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-triage-stage-wedged"
      summary: "tatara-operator parked {{ index $values \"C\" }} Task(s) with parkReason=triage-stalled in 1h. state=new is the operator's own triage pass with a 5m budget (F.4); blowing it means the operator could not classify the work item and hand it on - a Task that never reaches an agent. Check the operator ERROR log for the intake/classify path. NOTE: this counts the stall, not a stuck gauge - a state-age rule on `new` is impossible under v2.0.0 because parked(backlog-sweep) backlog owners live in `new` forever by design."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # #97: the six POD STAGES became the three LIVE STATES. stage.Live() is the table
  # (internal/stage/liveness.go:18-21) and it is exactly {refined, under-implementation,
  # awaiting-review} - a pod is a property of the state now, not a stage of its own.
  #
  # THE THRESHOLD MOVED 36h -> 8d, AND THAT IS THE POINT OF THIS EDIT. It is no longer
  # a wedge SLA, it is the last assertion this gauge can still honestly make. Park is
  # orthogonal in v2.0.0 and operator_task_state_age_seconds has no park dimension, so
  # a Task legitimately parked(awaiting-human) in a live state - budget ParkRetention,
  # 7d, then Reap - is indistinguishable from one that is wedged. 36h would false-fire on
  # every one of them. 8d (691200s) sits just past ParkRetention, so:
  #   - un-parked live Task: 24h admission (clock 1) + 5m readiness respawns (clock 2)
  #     + at most the single 24h residency cap that O3 gives ALL THREE live states
  #     (liveness.go:157-162) = ~48h. Never 8d. This was already the worst case before O3,
  #     because it was `refined`'s cap; O3 only brings under-implementation (was 6h) and
  #     awaiting-review (was 4h) up to the same number, so the bound is unchanged. The
  #     respawn term is no longer "3 x" - O3 deletes maxPodRecreations, and unbounded
  #     respawn is now watched by "Operator agent pod recreation loop" above rather than
  #     capped; it still cannot push a Task past its own state's 24h residency cap.
  #   - parked Task: reaped at ParkRetention 7d. Never 8d.
  # so anything past 8d means NO deadline is running at all - not the state budget, not
  # the residency cap, not the park-retention reaper. That is still the failure this rule
  # was written for; it is just the only version of it the metric can still express.
  #
  # Restoring same-day wedge detection needs a `parked` or `parkReason` label on
  # operator_task_state_age_seconds. The operator does not emit one - do not fake it by
  # narrowing the threshold back down.
  #
  # NOT COVERED HERE, deliberately: the operator-driven states merged (4h) and deployed
  # (2h) have real work budgets and their own rules in alerts/tatara-cd.yaml. Do not
  # "harmonise" those thresholds with this one.
  - name: "Operator pod stage wedged"
    queries:
      - expression: |
          max by (task, state) (operator_task_state_age_seconds{namespace="tatara",job="tatara-operator",state=~"refined|under-implementation|awaiting-review"})
    math_operator: ">"
    threshold: 691200
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-pod-stage-wedged"
      summary: "Task {{ index $labels \"task\" }} has been in state={{ index $labels \"state\" }} for {{ index $values \"C\" }}s (>8d). These are the three LIVE states (a live agent pod, idle clock + a single absolute 24h residency cap on all three since phase O3, previously 24h/6h/4h). Worst-case HEALTHY is ~48h un-parked (24h admission + respawns + the 24h residency cap) and 7d parked (ParkRetention, then the reaper). Past 8d NONE of those is being enforced: no state budget, no residency cap, no park-retention reap. The Task is holding a pod slot or a queue slot with no exit. This threshold is deliberately coarse - operator_task_state_age_seconds carries no park dimension in v2.0.0, so a tighter one would page on every legitimately parked Task."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # PAUSED 2026-08-08 (#97). NOT dark, NOT deleted - deliberately paused, because there
  # is no honest v2.0.0 expression of it and a wrong one is worse than a stopped one.
  #
  # The rule keyed on stage="clarifying". v2.0.0 DELETED both the `clarifying` stage and
  # the `clarify` agent kind ("`clarify` was the seventh and is DELETED: its three
  # decisions became action values on the implement outcome" - internal/stage/stage.go:43).
  # Human-wait is now park(awaiting-human): an orthogonal FLAG on whatever live state the
  # Task is in, whose only clock is ParkRetention (7d).
  #
  # There is no gauge of park age. operator_task_parked_total is a COUNTER of park EVENTS,
  # and awaiting-human is the one park reason that is explicitly benign (it is excluded
  # from "Operator task park spike" for exactly that reason), so counting it is noise, not
  # a signal. The "the deadline is not firing" assertion is already carried by "Operator
  # pod stage wedged" above, whose 8d threshold sits past ParkRetention and therefore
  # catches an awaiting-human park that the reaper never collected.
  #
  # UNPAUSE CONDITION, and it is a single concrete thing: the operator emitting a park-age
  # gauge (e.g. operator_task_park_age_seconds{task,parkReason}) or adding parkReason to
  # operator_task_state_age_seconds. Neither exists at tatara-operator origin/main today.
  # Do not unpause by re-pointing this at a live-state age - that is what "Operator pod
  # stage wedged" already does, and duplicating it would double-page.
  - name: "Operator human-wait stage wedged"
    is_paused: true
    queries:
      - expression: |
          max by (task) (operator_task_state_age_seconds{namespace="tatara",job="tatara-operator",state="refined"})
    math_operator: ">"
    threshold: 691200
    for: 30m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-human-wait-stage-wedged"
      summary: "PAUSED (#97). This rule watched stage=clarifying, which tatara-operator v2.0.0 deleted along with the clarify agent kind. Human-wait is now park(awaiting-human) - an orthogonal flag with no age gauge - so the rule has no honest successor and is paused rather than left dark or re-pointed at something it does not mean. The surviving coverage is \"Operator pod stage wedged\" (>8d in a live state, which catches an awaiting-human park the ParkRetention reaper never collected). Unpause when the operator emits a park-age gauge."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # #97: the `approved` stage is gone - v2.0.0 folded the pod-less approval hold into the
  # ordinary admission wait on the live states. What survived intact is the CONDITION it
  # watched: a Task that waited out clock 1 without ever getting an agent slot, which
  # parks(admission-starved) (stage.go:92, a member of the 28-value ParkReasons list).
  # Re-expressed on that counter, which - unlike the state-age gauge - has no park
  # ambiguity to work around.
  #
  # Threshold 0 / any occurrence, same as the pod-recreation-exhausted rule above: a Task
  # that burned 24h in a queue and got nothing is never routine. The PAUSED-project
  # exception the old summary called out no longer applies - a paused project (clock 1
  # disarmed, stage.go:718-721) cannot reach admission-starved at all, which is the whole
  # reason that exemption exists.
  - name: "Operator approved stage starved"
    queries:
      - expression: |
          sum by (state) (increase(operator_task_parked_total{namespace="tatara",job="tatara-operator",parkReason="admission-starved"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 30m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-approved-stage-starved"
      summary: "tatara-operator parked {{ index $values \"C\" }} Task(s) with parkReason=admission-starved (from state={{ index $labels \"state\" }}) in 1h. The Task waited out its 24h admission budget (F.4 clock 1) without ever being given an agent slot, so it parked without doing any work. That is a CAPACITY signal, not a code fault: check \"Operator agent pod pool saturated with queued work\" and \"Operator queue depth backlog\" for the lane that starved it, and maxConcurrentAgents / queue.alertCapacity for the project in tatara-helmfile. A PAUSED project cannot produce this - clock 1 is disarmed while maxConcurrentAgents == 0."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Operator illegal stage transition"
    queries:
      - expression: |
          sum by (from, to) (increase(operator_illegal_stage_transition_total{namespace="tatara",job="tatara-operator"}[15m])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-illegal-stage-transition"
      summary: "tatara-operator attempted {{ index $values \"C\" }} illegal state transition(s) from={{ index $labels \"from\" }} to={{ index $labels \"to\" }} in 15m. ANY non-zero value is a code bug in the F.3 transition table, not an operational condition. The metric name and its from/to labels survived v2.0.0 unchanged (internal/obs/stage_metrics.go:431); only the VALUES moved to the 8-state enum."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # Successor to the retired lifecycle-giveup alert (tatara_lifecycle_giveup_total went
  # with the issueLifecycle machine). The park counter is where a give-up now lands, and
  # since #521 it is the ONLY counter of a failure at all.
  #
  # #97 - THE NEGATIVE-MATCHER INVERSION, and it is the reason this rule is fixed here
  # rather than merely renamed. v2.0.0 renamed the label stageReason -> parkReason. A
  # POSITIVE matcher on a dead label selects nothing and goes silently OK; a NEGATIVE one
  # (`stageReason!~"..."`) matches EVERY series, because a series with no stageReason label
  # trivially satisfies "stageReason is not one of these". So this rule did not go dark
  # like its siblings - it inverted, and spent 2026-08-08 firing on the ~36 benign
  # awaiting-human parks its own summary says it deliberately excludes. Audit every
  # negative matcher separately after any label rename: they fail LOUD, not silent.
  - name: "Operator task park spike"
    queries:
      - expression: |
          sum by (parkReason) (increase(operator_task_parked_total{namespace="tatara",job="tatara-operator",parkReason!~"backlog-sweep|awaiting-human"}[3h])) or vector(0)
    math_operator: ">"
    threshold: 3
    for: 30m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-task-park-spike"
      summary: "{{ index $values \"C\" }} park event(s) (transitions, not distinct Tasks - a park/un-park flap inflates this) with parkReason={{ index $labels \"parkReason\" }} in 3h (>3). Successor to the lifecycle give-up alert. backlog-sweep is excluded (it is the zero-cost mint path that OWNS a backlog issue and spawns no pod) and awaiting-human is excluded (a human not having replied yet is not a platform failure). Everything else here is the platform failing to deliver."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # kind=review is the ONE outcome kind whose commit does not itself advance the Task's
  # state: the advance is deferred to MergeRequestReconciler -> DrainPendingReview ->
  # advanceAfterReview, a SECOND reconciler racing the pod-liveness caps. A 5m handoff
  # deadline (tatarav1alpha1.HandoffDeadline) bounds that race: if the drain has not
  # advanced the Task within 5m of the outcome landing, it parks parkReason=handoff-stalled.
  # ANY occurrence matters (threshold 0, mirrors pod-recreation-exhausted above) because
  # the review already landed - the PR is approved and posted - and this Task's only
  # recovery path left is a backlog-sweep re-mint. Two causes: a dead drain (the
  # MergeRequest CR was deleted, the workqueue item was dropped, or leader election
  # changed over) versus a drain that was merely slow because the forge was degraded for
  # more than 5m (false positive - the work is fine, just late). Correlate with SCM/webhook
  # error-ratio alerts in the same window to tell the two apart.
  - name: "Operator handoff drain stalled"
    queries:
      - expression: |
          sum(increase(operator_task_parked_total{namespace="tatara",job="tatara-operator",parkReason="handoff-stalled"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-handoff-drain-stalled"
      summary: "tatara-operator parked {{ index $values \"C\" }} Task(s) in 1h with parkReason=handoff-stalled. A review outcome was accepted and the PR review already landed, but the cross-reconciler drain (MergeRequestReconciler -> DrainPendingReview -> advanceAfterReview) did not advance the Task within the 5m handoff deadline, so it parked instead of progressing. Check whether the MergeRequest CR was deleted, the workqueue item was dropped, or leader election changed over (dead drain, needs a fix or a manual nudge) versus an SCM/forge degradation lasting over 5m that only slowed the drain down (false positive, work is fine). Recovery today is a backlog-sweep re-mint; a human should confirm which case this is before waiting on that."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Release-train integrity + the etcd object budget. Both are CRITICAL on ANY value.
  # ----------------------------------------------------------------------------
  # The operator injects TATARA_CONTRACT_VERSION=2; the cli refuses to boot on a mismatch
  # and the operator parks the Task with parkReason=agent-contract-mismatch BEFORE turn-0
  # (contract G.10). The wrapper image is pinned in a DIFFERENT helm release
  # (project-tatara) than the operator, and helmfile applies releases CONCURRENTLY, so
  # new-operator + old-agent IS reachable. This is the alert that catches a skewed train.
  - name: "Operator agent contract version mismatch"
    queries:
      - expression: |
          sum by (expected, got, image) (increase(operator_agent_contract_mismatch_total{namespace="tatara",job="tatara-operator"}[5m])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 1m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-contract-version-mismatch"
      summary: "{{ index $values \"C\" }} agent pod(s) reported contract version {{ index $labels \"got\" }} where the operator expects {{ index $labels \"expected\" }} (image {{ index $labels \"image\" }}). The four-release train is SKEWED: the agent image pin in the project-tatara release did not land with the operator. Every Task that spawns a pod fails instantly. Fix the pin in tatara-helmfile values/project-*/common.yaml agent.image; do not restart the operator."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # K.2 minimum alert set: "UNEXPECTED MERGE (CRITICAL)". C.9's accepted-risk detector:
  # an MR found merged with no corresponding mergeCursor advance, i.e. something other
  # than the operator's own sequential merge (C.5) put code on a cluster-admin-scoped
  # deploy path.
  - name: "Operator unexpected merge detected"
    queries:
      - expression: |
          sum by (repo) (increase(operator_unexpected_merge_total{namespace="tatara",job="tatara-operator"}[15m])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-unexpected-merge-detected"
      summary: "{{ index $values \"C\" }} unexpected merge(s) on repo {{ index $labels \"repo\" }} in 15m - an MR merged without the operator's mergeCursor advancing. Something other than the operator's own sequential merge (contract C.5) put code on a cluster-admin-scoped deploy path. Investigate who merged it and what shipped, immediately."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # A.7: the pre-write byte guard marshals every object before Update and evicts oldest
  # comments/notes until it fits under 800,000 bytes. This fires when it COULD NOT evict
  # enough. A 413 is not retried by RetryOnConflict, so every writer fails, the Task
  # becomes permanently unwritable, and its Issues/MRs stay pinned by ownership forever -
  # the worst failure mode in the whole design.
  - name: "Operator object too large to write"
    queries:
      - expression: |
          sum by (kind, name) (increase(operator_object_too_large_total{namespace="tatara",job="tatara-operator"}[15m])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-object-too-large-to-write"
      summary: "tatara-operator could not fit {{ index $labels \"kind\" }}/{{ index $labels \"name\" }} under the 800,000-byte object budget after evicting everything evictable ({{ index $values \"C\" }} attempt(s) in 15m). That object is now PERMANENTLY UNWRITABLE and any Issue/MergeRequest it owns is pinned open forever. Manual intervention required."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # A.7's OTHER refusal, and the one that is NOT a code bug. "Operator object too large to
  # write" above is "nothing left to evict"; these two are "there IS something to evict but
  # it cannot be spilled to tatara-memory, so the write is REFUSED". That policy is
  # deliberate (SPILL FIRST, DROP ONLY ON SPILL SUCCESS - a memory outage is a fault that
  # gets repaired and no comment or note should be lost meanwhile), which is exactly why it
  # needs an alert: a deliberately blocking policy has to be bounded in TIME or it is
  # indistinguishable from a wedge. Until tatara-operator#469 it was entirely silent, so an
  # object wedged by a memory outage looked exactly like a healthy one.
  # Split by `reason` because the two have opposite responses. Both counters are PRE-SEEDED
  # per guarded kind (Issue|MergeRequest|Task x spill_error|unconfigured, objbudget_metrics.go),
  # so a zero baseline exists from operator startup and plain increase() is safe here - no
  # counter-birth blind spot to work around.
  # NOTE: `kind` here is the CR kind being written (Issue|MergeRequest|Task), NOT the A.4
  # Task origin kind - see scripts/stage_values_allowlist.txt's kind:exempt-metrics section.
  - name: "Operator status writes blocked by an unspillable eviction batch"
    queries:
      - expression: |
          sum by (kind) (increase(operator_objbudget_spill_blocked_total{namespace="tatara",job="tatara-operator",reason="spill_error"}[30m])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-status-writes-blocked-by-an-unspillable-eviction-batch"
      summary: "tatara-operator refused {{ index $values \"C\" }} {{ index $labels \"kind\" }} status write(s) in 30m because their over-budget eviction batch could not be spilled to tatara-memory, and has been doing so for 15m. The guard blocks rather than dropping ON PURPOSE, so nothing is lost - but every writer for those objects is failing meanwhile and they stay unwritable until memory returns. This is the memory outage's real blast radius now that agents are no longer gated (#470): check \"Memory stack stuck not ready\" for the owning project first; if memory is healthy, the spill target itself is broken."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # reason=unconfigured is NOT an outage: the guard had an eviction batch to spill and no
  # spiller wired up at all. It cannot self-heal, no memory stack can fix it, and it will
  # refuse writes forever, so it pages faster than the outage case above.
  - name: "Operator objbudget spiller unconfigured"
    queries:
      - expression: |
          sum by (kind) (increase(operator_objbudget_spill_blocked_total{namespace="tatara",job="tatara-operator",reason="unconfigured"}[30m])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-objbudget-spiller-unconfigured"
      summary: "tatara-operator refused {{ index $values \"C\" }} {{ index $labels \"kind\" }} status write(s) in 30m with reason=unconfigured: the A.7 byte-budget guard needed to spill an eviction batch and NO spiller is wired up. This is a WIRING BUG, not an outage - it will never clear on its own, no memory stack can repair it, and every over-budget write of that kind is refused until a deploy fixes it. Do not wait for it to self-heal."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # B.2 rule 5: an Issue/MR must NEVER have zero controller owners. An artifact with plain
  # owners and no controller owner is worked by nobody and re-minted by nobody (the orphan
  # predicate sees an owned Issue). The operator repairs it by promoting the oldest
  # surviving owner - this alert says the repair guard had to fire, i.e. an ownership
  # invariant broke somewhere in the fold (B.3) or reap (B.5) path.
  - name: "Operator artifact left with no controller owner"
    queries:
      - expression: |
          sum(increase(operator_orphan_no_controller_total{namespace="tatara",job="tatara-operator"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-artifact-left-with-no-controller-owner"
      summary: "tatara-operator's ownership repair guard fired {{ index $values \"C\" }} time(s) in 1h: an Issue or MergeRequest was found with plain owners and NO controller owner. The fold or reap controller-handover path has a bug. The guard repaired it by promoting the oldest surviving owner, but the invariant broke."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  - name: "Operator GC blocked"
    queries:
      - expression: |
          sum by (reason) (increase(operator_gc_blocked_total{namespace="tatara",job="tatara-operator"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-gc-blocked"
      summary: "tatara-operator could not garbage-collect {{ index $values \"C\" }} object(s) in 1h, reason={{ index $labels \"reason\" }} (no_controller_owner | fold_in_flight | doc_reference). Tasks and their Issue/MergeRequest CRs are accumulating in etcd. A fold_in_flight that never clears means a refine umbrella died mid-adoption."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # The sweep. This is the ONLY heartbeat in the tatara alert set.
  #
  # Every alert file sets default_no_data_state: "OK" and grafana.tf sets
  # default_exec_err_state = "OK". For a gauge that legitimately vanishes when the fleet is
  # idle that is correct. For a HEARTBEAT it is catastrophic: NoData IS the failure, and OK
  # is the failure being reported as health. If the operator stops sweeping - or stops
  # existing - this rule must PAGE, not go quiet. With no `or vector(0)` on this expression
  # an absent series produces a genuinely empty result, so NoData is REACHABLE here (an
  # `or vector(0)` would make noDataState dead code).
  #
  # exec_err_state is "Error", NOT "Alerting" (tatara-observability#65): a failed query is
  # not a stalled sweep. Grafana changed this same default in 9.2.0 (PR #55345, issue
  # #46398) for exactly this reason. "An absent series means the operator is not sweeping"
  # is an argument for noDataState, which is a different knob and is still Alerting.
  #
  # CADENCE LIVES IN THE PRODUCER (tatara-operator#441). The rule reads
  # operator_sweep_next_expected_timestamp_seconds, which the operator computes per
  # (project, activity) from that activity's own cron in the Project CR, and carries a
  # single GRACE PERIOD. The previous flat 21600s threshold was breached for roughly 18
  # hours of every 24 by the 0 3 * * * / 0 6 * * * nightly crons. One rule covers every
  # activity of every Project, and a new activity or Project needs no rule change.
  #
  # Grace is 3h, not the 30m a naive reading suggests. This used to be sized around the
  # refine pre-scan barrier, which could legitimately hold a scan for up to 2h; that
  # barrier is gone (operator v1.35, refine now runs on its own cron with no hold), but 3h
  # stays as headroom against ordinary cron/queueing jitter across every (project,
  # activity) pair - a shorter grace reintroduces the false fires this rule exists to
  # remove. A fully-missed nightly batch pages ~3h late instead of being invisible.
  # Successor to "Operator scan loop stalled" (tatara_scan_*, deleted with the scan).
  #
  # DEMAND-DRIVEN ACTIVITIES ARE DELIBERATELY ABSENT FROM THIS RULE. Brainstorm stopped
  # being periodic in operator v1.35: it refills on a level-triggered reconcile pass and
  # pauses only on an agent's explicit exhausted verdict, so the operator retracts
  # activity="brainstorm" from operator_sweep_next_expected_timestamp_seconds
  # unconditionally, regardless of the Project's own brainstorm.enabled. Do not "fix" the
  # missing series. Under demand-driven scheduling a correctly-paused project is
  # indistinguishable from a wedged one by this metric, and a rule that fires when the
  # system is working correctly trains people to ignore it. The paused state is carried by
  # operator_brainstorm_paused{project} instead (see tatara-operator's obs package).
  # activity="refine" replaced it here: refine is genuinely periodic grooming and now
  # carries its own cron (spec.scm.cron.refine.schedule).
  # ----------------------------------------------------------------------------
  - name: "Operator sweep heartbeat stale"
    queries:
      - expression: |
          time() - operator_sweep_next_expected_timestamp_seconds{namespace="tatara",job="tatara-operator"}
    math_operator: ">"
    threshold: 10800
    for: 10m
    decimal_points: 0
    no_data_state: "Alerting"
    exec_err_state: "Error"
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-sweep-heartbeat-stale"
      summary: "IF THIS ARRIVED AS alertname=DatasourceError, STOP AND READ annotations.Error FIRST: the rest of this summary is the FIRING-case template rendered against an empty result set and every number in it is a lie (counts read 0, label values read empty). Grafana could not evaluate the rule at all. If Error mentions `pq:` or SQLSTATE 53300 (\"remaining connection slots are reserved\"), the failure is GRAFANA'S OWN backing Postgres (grafana-database-cluster, ns monitoring) - not this rule's datasource, not tatara, and not anything in the query below. See \"Grafana alert rule evaluation failing\" in alerts/tatara-grafana.yaml; that is the detector for it, and it recurs nightly around 03:30 UTC. OTHERWISE: tatara-operator project {{ index $labels \"project\" }} activity={{ index $labels \"activity\" }} is {{ index $values \"C\" }}s past its own next expected run (>3h grace). The next-expected timestamp is computed by the operator from that activity's cron and its last success, so this is a genuinely missed run, not a cadence mismatch. NoData on this rule is ALSO a failure and is configured to fire: an absent series means the operator published no next expected run for any activity at all."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  # Regrouped by project (tatara-operator#441): operator_sweep_errors_total carries
  # `project` first now, so without it in the grouping three Projects' errors sum into one
  # series. The `or vector(0)` guard pairs with a `>` threshold on the operator's OWN
  # metric, which is the safe direction, and stays.
  - name: "Operator sweep erroring"
    queries:
      - expression: |
          sum by (project, activity, reason) (increase(operator_sweep_errors_total{namespace="tatara",job="tatara-operator"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 5
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-sweep-erroring"
      summary: "tatara-operator sweep project={{ index $labels \"project\" }} activity={{ index $labels \"activity\" }} errored {{ index $values \"C\" }} time(s) in 1h (reason={{ index $labels \"reason\" }}). The heartbeat may still be green if SOME passes succeed; this catches the partially-failing sweep."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # Migrated off Loki (tatara-observability#63). The old rule ran a
  # `pattern | line_format | json` LogQL pipeline that took ~9.6s over ~50 lines, and its
  # exec_err_state: Alerting made it page on its own query timeout. The operator DECIDES
  # this condition in its own code, so hard rule 13 says it exports a counter and the
  # alert reads that; logs stay the drill-down path and keep the free-text description,
  # which is deliberately not a metric label.
  #
  # Grouped by category ONLY, not by (category, severity): Grafana merges query-result
  # labels with the rule's configured labels and the CONFIGURED one wins, so two instances
  # differing only in the metric's `severity` would collapse under this rule's routing
  # label severity="warning". The counter keeps both labels producer-side.
  #
  # NOT increase(agent_internal_issue_total[5m]) (fix #71-1). agent_internal_issue_total is
  # deliberately NOT pre-seeded in the operator, so a child series is born by its own first
  # Inc() with its first exported sample already =1. Within the 5m window Prometheus then
  # sees a flat "1,1,...": delta=0, so increase()=0 (or, with only one sample in the
  # window, no result at all) - the alert cannot see a counter's own birth. Series identity
  # includes `pod`, three operator replicas serve turn-complete callbacks through the
  # Service, and pods restart near-daily, so the dropped set is one event per
  # (category, severity, pod) per pod lifetime: plausibly most reports. The Loki rule this
  # replaced fired on the very first line, so increase() here shipped LESS detection than
  # what it replaced.
  #
  # Fix: a per-series (not aggregate) manual subtraction that supplies a zero for any
  # series absent 5m ago, instead of increase()'s "need two samples in the window" rule.
  # `agent_internal_issue_total offset 5m or 0 * agent_internal_issue_total` prefers the
  # real value from 5m ago when that exact series existed then (steady case: ordinary
  # delta); when it did not (brand-new series, born within the window), `or` falls back to
  # the 0*current term instead, which PromQL's vector match still lines up against the
  # SAME series' current value - subtracting current - 0 = current, so a fresh series'
  # first sample (1) crosses the >0 threshold immediately. A series that VANISHED mid-
  # window (pod recycled) has no entry in the "current" half of the outer subtraction at
  # all - PromQL's binary-op vector matching is an inner join on the full label set - so it
  # is silently excluded from the sum rather than contributing a spurious negative term;
  # this is why the subtraction is done PER SERIES, before the `sum by (category)`, not
  # after. clamp_min(...,0) per series additionally guards against the one case the
  # subtraction does not model: an in-memory counter reset from a same-window process
  # crash-restart (same pod, not a new series) would otherwise produce a negative delta
  # for that one series, which could silently absorb another pod's genuine positive delta
  # in the same by(category) sum. DO NOT remove clamp_min as "redundant with the offset
  # guard above" - it is not: the offset/0* fallback solves the BIRTH case (a series
  # absent 5m ago), while clamp_min solves a DIFFERENT case (a series present both then
  # and now, but whose counter value went backward because the process restarted) that
  # the offset fallback does nothing for.
  #
  # Verified against live Prometheus (2026-07-25, grafana MCP, structural analog
  # operator_task_terminal_total / operator_reconcile_total - agent_internal_issue_total
  # itself currently has zero live series, nothing to report): the subtraction's numeric
  # output matches increase()'s within extrapolation rounding for a steady counter; an
  # empty-selector ("no series at all") case runs clean with an empty result, matching
  # increase()'s existing NoData behavior (no regression there); a vanished-series case is
  # provably excluded from the sum by the inner-join semantics above, not zeroed. No pod
  # restarted during the live check, so the brand-new-series branch is proven by PromQL
  # vector-matching semantics rather than by an observed live birth; the algebra is exact
  # (`or` is a label-set union preferring its left operand, and vector subtraction matches
  # on the full label set), not a guess.
  - name: "Tatara agent reported platform problem"
    queries:
      - expression: |
          sum by (category) (
            clamp_min(
              agent_internal_issue_total{namespace="tatara",job="tatara-operator"}
              - (agent_internal_issue_total{namespace="tatara",job="tatara-operator"} offset 5m
                 or 0 * agent_internal_issue_total{namespace="tatara",job="tatara-operator"}),
              0
            )
          )
    math_operator: ">"
    threshold: 0
    for: 1m
    decimal_points: 0
    exec_err_state: "Error"
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-tatara-agent-reported-platform-problem"
      summary: "IF THIS ARRIVED AS alertname=DatasourceError, STOP AND READ annotations.Error FIRST: the rest of this summary is the FIRING-case template rendered against an empty result set and every number in it is a lie (counts read 0, label values read empty). Grafana could not evaluate the rule at all. If Error mentions `pq:` or SQLSTATE 53300 (\"remaining connection slots are reserved\"), the failure is GRAFANA'S OWN backing Postgres (grafana-database-cluster, ns monitoring) - not this rule's datasource, not tatara, and not anything in the query below. See \"Grafana alert rule evaluation failing\" in alerts/tatara-grafana.yaml; that is the detector for it, and it recurs nightly around 03:30 UTC. OTHERWISE: Tatara agents reported {{ index $values \"C\" }} internal issue(s) of category={{ index $labels \"category\" }} in 5m. Drill down in Grafana Explore: {namespace=\"tatara\", app=\"tatara-operator\"} | pattern `<_> <_> <_> <body>` | line_format `{{\"{{\"}}.body{{\"}}\"}}` | json | action=\"agent_internal_issue\" for the free-text descriptions."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # Threshold raised 100 -> 350 (2026-08-17, second raise same day). #114 sized 100 for
  # issueScan at `0 * * * *` (hourly): 15 repo-sweep slots/h across all three projects *
  # maxNewTasksPerSweep (5) = ~75 mints/h worst case. issueScan is moving again, hourly ->
  # `*/15 * * * *`, before that PR even finished propagating - repo_slots_per_hour = repos *
  # (3600 / period_seconds), so quartering the period quadruples the slots: 15 repos * 4
  # passes/h = 60 repo-sweep slots/h, i.e. up to ~300 mints/h worst case, 3x over the 100
  # this alert currently guards. 350 leaves headroom above that 300 worst case without
  # hiding a real mint/reap loop (which runs far above 350, sustained, not a one-window
  # spike) - the thing this alert exists to catch. Measured over the prior 7 days: actual
  # mints were 16 total across all projects, all parked(backlog-sweep), zero active - this
  # threshold guards a theoretical ceiling, not observed behavior.
  - name: "Operator task mint burst"
    queries:
      - expression: |
          sum(increase(operator_tasks_minted_per_sweep_sum{namespace="tatara",job="tatara-operator"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 350
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-task-mint-burst"
      summary: "tatara-operator minted {{ index $values \"C\" }} Tasks in 1h (>350). Each repo in a project gets its own sweep pass, each capped at maxNewTasksPerSweep (5), so the hourly ceiling scales with repo count and cron cadence (15 repos at */15 * * * * = up to ~300/h worst case), not a flat 5/h. This is either a mint/reap loop (an issue being re-minted because ownership is not sticking) or a genuine backlog drain. Check sum by (parkReason) (operator_task_parked_total{parkReason=\"backlog-sweep\"}) against operator_task_state{state=\"new\"}: a healthy backlog drain mints parked(backlog-sweep) Tasks that sit in state=new and spawn ZERO pods."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # Threshold raised 6 -> 24 (2026-08-17), same root cause as the mint-burst raise above,
  # here window-bounded rather than open-ended: this rule sums cap-hit events per (project,
  # cap) over a fixed 3h window, and the number of sweep passes that can land inside that
  # window scales directly with cadence. At the old hourly issueScan, one repo capping every
  # single pass for 3h straight produces at most 3 hits (180min / 60min) - below the old
  # threshold of 6 on its own, so it took roughly two simultaneously-saturated repos to
  # cross it. At */15 * * * *, the same fully-saturated single repo produces up to 12 hits
  # in the same 3h window (180min / 15min) - already double the old threshold of 6, from
  # ONE repo's ordinary post-cutover backlog drain, which the summary below explicitly
  # calls "expected for a few hours after cutover", not a page-worthy condition. 24
  # preserves the original design's bar of roughly two simultaneously-saturated repos
  # (2 * 12 = 24, same ratio as 2 * 3 = 6 before) rather than loosening or tightening it,
  # scaled by the same 4x cadence factor as the mint-burst rule. It stays far below what a
  # sweep "starving past a day" (this rule's own sustained-problem bar) would accumulate:
  # a single chronically-capped repo alone would rack up 12 hits every 3h, indefinitely.
  # Live check (2026-08-17, 7d window): sum by (project,cap) (increase(
  # operator_sweep_mint_cap_hit_total[7d])) reads ~1 for project=tatara,cap=
  # maxNewTasksPerSweep and 0 for project=mtg,cap=maxOpenTasks - consistent with the
  # near-zero measured mint volume above, so this is a proactive recalibration against a
  # theoretical worst case, not a reaction to live false-firing.
  - name: "Operator sweep creation budget chronically capped"
    queries:
      - expression: |
          sum by (project, cap) (increase(operator_sweep_mint_cap_hit_total{namespace="tatara",job="tatara-operator"}[3h])) or vector(0)
    math_operator: ">"
    threshold: 24
    for: 30m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-sweep-creation-budget-chronically-capped"
      summary: "The sweep for project {{ index $labels \"project\" }} hit its {{ index $labels \"cap\" }} budget {{ index $values \"C\" }} times in 3h (>24). Orphan Issues are being discovered faster than the creation budget lets them be minted. Expected for a few hours after cutover (a 150-issue backlog takes about 30 passes at 5/pass, and each repo now gets its own sweep pass every 15m); sustained past a day it means maxOpenTasks is starving the sweep."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # K.2 minimum alert set: "docs never written (WARNING)" (fixes M21/L29). The nightly
  # documenting batch starved and never ran. Every Task eligible for docs stays
  # permanently undocumented - documentedBy never re-arms once empty (F.3's delivered row).
  - name: "Operator documentation batch abandoned"
    queries:
      - expression: |
          sum by (reason) (increase(operator_doc_task_abandoned_total{namespace="tatara",job="tatara-operator",reason="never_ran"}[25h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-documentation-batch-abandoned"
      summary: "tatara-operator's nightly documentation batch did not run in the last 25h ({{ index $values \"C\" }} Task(s) abandoned). Every delivered Task eligible for docs (fix F2) is now permanently undocumented until the next batch picks up NEW eligible Tasks - documentedBy never retries the ones it missed."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # ----------------------------------------------------------------------------
  # Pod TTL, SCM egress, and the bundle byte budget.
  # ----------------------------------------------------------------------------
  # G.7 stop sequence: drain the in-flight turn, submit the handoff turn, hard cap, then a
  # SYNTHETIC operator handoff note, then stop the pod.
  #
  # This fired on outcome=force_deleted until tatara-operator#527, and it was measuring the
  # wrong bucket. outcome answers "how was the POD stopped?" and says NOTHING about whether
  # continuation state survived: a pod whose agent wrote a perfect handoff and whose wrapper
  # then failed to tear down cleanly was reported force_deleted, while the actual work-loss
  # case was invisible for 19 days. The operator now reports a second, independent label.
  # handoff answers "how was the CONTINUATION STATE captured?":
  #   agent     - the agent answered the handoff turn and wrote its own note
  #   synthetic - the operator wrote the note from the last turn's finalText/pushedRepos
  #   none      - the operator held NOTHING to write; the note that landed is a placeholder
  # Notes ARE the continuation state (A.4), so handoff=none is silent work loss.
  #
  # It is not the ONLY discontinuity, only the only one this metric can see. A pod lost
  # BEFORE its TTL (crash, eviction) goes through respawnLostPod, which writes no handoff
  # note and increments no TTL counter at all - that discontinuity is uncounted, and visible
  # only as the operator's pod_respawn log action and Task.status.stats.podRecreations. Read
  # this rule as "TTL stops that lost work", not "every Task that lost work".
  - name: "Operator agent pod TTL-stopped with no handoff captured"
    queries:
      - expression: |
          sum by (agent_kind) (increase(operator_agent_pod_ttl_expired_total{namespace="tatara",job="tatara-operator",handoff="none"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-pod-ttl-stopped-with-no-handoff-captured"
      summary: "{{ index $values \"C\" }} {{ index $labels \"agent_kind\" }} agent pod(s) were TTL-stopped in 1h with NO continuation state captured - no agent handoff, and no status.lastTurn for the operator to build a synthetic one from. The note that landed is a placeholder, so the next pod for that Task resumes from a bundle missing the last turn's work and re-runs turn-0. Silent work loss; the Task will look healthy."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # The STOP dimension, kept as its own separate signal. A force-delete means the graceful
  # stop failed against a live pod (a wedged turn, an unresponsive PTY). Worth knowing - it is
  # a wrapper-health signal - but on its own it is not work loss, so it no longer carries that
  # claim and no longer shares a threshold with the rule above.
  - name: "Operator agent pod force-deleted at TTL"
    queries:
      - expression: |
          sum by (agent_kind) (increase(operator_agent_pod_ttl_expired_total{namespace="tatara",job="tatara-operator",outcome="force_deleted"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 2
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-agent-pod-force-deleted-at-ttl"
      summary: "{{ index $values \"C\" }} {{ index $labels \"agent_kind\" }} agent pod(s) had to be FORCE-DELETED at TTL in 1h - the graceful G.7 stop failed against a live pod. This is a wrapper-health signal, not work loss on its own: read the handoff label on the same metric to see whether continuation state survived."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # C.8: doPagedGET now carries the rate-limit handling that previously existed only on the
  # write path, plus a per-project egress token bucket (about 20 req/s). A rate-limited read
  # means the mirror is going stale, which means every agent bundle is going stale.
  - name: "Operator SCM rate limited"
    queries:
      - expression: |
          sum by (provider, limit_type) (increase(operator_scm_ratelimited_total{namespace="tatara",job="tatara-operator"}[10m])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-scm-rate-limited"
      summary: "tatara-operator was rate-limited by {{ index $labels \"provider\" }} {{ index $values \"C\" }} time(s) in 10m (limit_type={{ index $labels \"limit_type\" }}). GitHub's secondary limit is 80 content-creating requests/min and 500/hour. The Issue/MergeRequest mirror is falling behind, so every context bundle rendered from it is stale."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  # E.5 / D1: the bundle has a HARD byte budget (maxBundleBytes, default 400 KB). Oldest
  # comments elide first, behind an explicit <comments total= rendered= elided=> marker - the
  # agent is never lied to about completeness. Elision firing at all means an Issue thread has
  # outgrown the budget and agents are now working from a partial thread.
  - name: "Operator context bundle over budget"
    queries:
      - expression: |
          sum by (agent_kind) (increase(operator_bundle_elided_total{namespace="tatara",job="tatara-operator"}[1h])) or vector(0)
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-operator-context-bundle-over-budget"
      summary: "{{ index $values \"C\" }} context bundle(s) for {{ index $labels \"agent_kind\" }} agents exceeded maxBundleBytes in 1h and had their oldest comments elided. The agent is told (the <comments elided=> marker is explicit), but it is working from a partial thread. At a 400 KB budget against an 8192-byte comment cap this should essentially never fire."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
