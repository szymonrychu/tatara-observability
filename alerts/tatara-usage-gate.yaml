---
# Claude account usage windows + per-kind gate (claudeSubscription mode) alert
# rules. Sourced from the operator's usage-window poller and admission gate
# (tatara_account_usage_*, tatara_account_overage_*, operator_admission_blocked_total
# {reason="kind_ceiling"} - tatara-operator internal/accountusage + internal/obs/
# operator_metrics.go) and, forward-looking, Claude Code's native OTel export
# (claude_code.cost.usage / claude_code.api_error - tatara-claude-code-wrapper,
# lands via a separate OTLP->Prometheus collector deploy through tatara-helmfile).
# Surfaced on "Tatara - Claude Usage Windows" (dashboards/claude-usage-windows.json).
# See docs/superpowers/specs/2026-07-04-claude-subscription-usage-gate-design.md.
interval_seconds: 60
default_no_data_state: "OK"
rules:
  # PORTED FROM THE CHART PLANE (tatara-helmfile#440). tatara-operator's chart ships a
  # 32-alert PrometheusRule, and this cluster's Prometheus has never loaded it: the
  # ruleSelector matches release=prometheus and tatara-helmfile never set
  # prometheusRule.additionalLabels. Labelling it was the obvious fix and is the wrong
  # one - the cluster Alertmanager is stock kube-prometheus-stack with route.receiver
  # "null", one child route for Watchdog, and ONE receiver named "null" carrying zero
  # integrations. PvcBackupJobFailed is firing on 11 series into it right now. Grafana is
  # the only plane that delivers, because the Tatara contact point webhooks
  # /operator/webhooks/tatara/grafana, which is the incident-Task minting path. So the
  # chart plane is being turned off and the conditions with no witness here are moving.
  #
  # This is TataraAccountUsageFeedDead. tatara-operator#635 filed the same condition as
  # "never written" on a grep of this repo; it was written, in the plane that delivers
  # nothing. That issue's remedy is this rule.
  #
  # NO `or vector(0)`, deliberately, and this is the load-bearing detail.
  # tatara_account_usage_gate_ready is a LABEL-LESS GaugeVec, not a Gauge, precisely so
  # that its child is created on first Set: an operator with the budget gate off emits NO
  # SERIES AT ALL (tatara-operator internal/obs/accountusage_metrics.go). Absent -> NoData
  # -> "OK" via this file's default is the CORRECT reading - no gate, no gate failure. A
  # fabricated zero would page forever on every project that has the gate off, which is
  # the inverse of what the metric was shaped to allow.
  - name: "Claude account usage gate not ready"
    queries:
      - expression: |
          tatara_account_usage_gate_ready
    math_operator: "<"
    threshold: 1
    for: 30m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-claude-account-usage-gate-not-ready"
      summary: "tatara_account_usage_gate_ready has read {{ index $values \"C\" }} (<1) for 30m: tokenBudget is enabled in claudeSubscription mode but no usage snapshot newer than tokenBudgetMaxSnapshotAge is governing admission, so the gate FAILS OPEN and admits every spawn regardless of how much of the shared Claude subscription is already burnt. This is the compensating control for that fail-open, and it is deliberately NOT derived: the pre-existing budget rule watches operator_admission_blocked_total{reason=\"token_budget\"}, a counter that by construction never increments while the gate evaluates nothing, so the gate ran inert for weeks reading green. Check tatara_account_usage_snapshot_age_seconds for WHICH feed went quiet and how long ago - source=\"poller\" is the /api/oauth/usage path (see \"Claude account usage poll unhealthy\" in this file), source=\"wrapper\" is the cc-statusline turn-complete callback, and ccw_statusline_reports_total on the pushed wrapper metrics tells a dead statusline apart from an operator not persisting Task.status.accountUsage. Do NOT widen tokenBudgetMaxSnapshotAge to clear this: that makes a staler snapshot count as fresh and returns the gate to inert-but-green."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Claude account usage poll unhealthy"
    queries:
      # Guarded on poller_enabled==1, mirroring issue #33's
      # "and (spec_replicas >= 1)" pattern in tatara-operator.yaml: when
      # USAGE_ENABLED=false (the deploy default for claudeSubscription mode,
      # which uses the wrapper-reported usage path instead - see
      # tatara-helmfile values/tatara-operator/default.yaml), poll_health
      # permanently reads 0 (never polled, not stale) and would false-fire
      # forever without this guard. Disabled -> guard series is 0 -> `and`
      # drops the joined series -> NoData -> default_no_data_state: "OK".
      # Issue #339.
      - expression: |
          tatara_account_usage_poll_health and (tatara_account_usage_poller_enabled == 1)
    math_operator: "<"
    threshold: 1
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-claude-account-usage-poll-unhealthy"
      summary: "tatara_account_usage_poll_health={{ index $values \"C\" }} (<1) for 15m while the poller is enabled. The /api/oauth/usage poller has exceeded its failure threshold; the account-usage snapshot is stale. The gate keeps holding on the last-known windows until each expires (eventual fail-open, by design - a claudeSubscription project has no customWindow inputs to fall back to); the OTel 429 backstop is the hard floor. Check operator logs for poll errors (auth, 429, schema drift)."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
  - name: "Claude account usage window near emergency ceiling"
    queries:
      - expression: |
          max(tatara_account_usage_utilization)
    math_operator: ">"
    threshold: 80
    for: 15m
    decimal_points: 1
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-claude-account-usage-window-near-emergency-ceiling"
      summary: "Highest Claude account usage window is at {{ index $values \"C\" }}% (>80%, the operator's DefaultEmergencyPercent) for 15m. The shared subscription is close to a window ceiling; only the incident kind (98% ceiling) still has headroom. THRESHOLD IS PROVISIONAL: reused from budget.DefaultEmergencyPercent (tatara-operator internal/budget/budget.go) as the closest existing platform convention for 'emergency'; tune once real five_hour/seven_day utilization data accumulates."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "critical"
  - name: "Claude Code API 429 rate (reactive backstop) - PENDING OTel deployment"
    queries:
      - expression: |
          (sum(rate(claude_code_api_error_total{status_code="429"}[5m])) or vector(0))
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 3
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-claude-code-api-429-rate-reactive-backstop-pending-otel-deployment"
      summary: "Claude Code agents hit HTTP 429 at {{ index $values \"C\" }}/s over 5m (reactive backstop per the design spec's 'any live-turn 429 -> emergency fleet stop' floor). The proactive per-kind gate failed to prevent a rate-limit hit; treat as an incident. INERT UNTIL DEPLOYED: this metric requires Claude Code native OTel to be enabled on wrapper agent pods (Phase B, tatara-claude-code-wrapper) and the OTLP->Prometheus collector wired via tatara-helmfile (Phase D) - both land after this dashboard/alert PR."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "critical"
  - name: "Claude account monthly overage climbing"
    queries:
      - expression: |
          tatara_account_overage_percent
    math_operator: ">"
    threshold: 80
    for: 30m
    decimal_points: 1
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-claude-account-monthly-overage-climbing"
      summary: "Monthly pay-as-you-go overage utilization is {{ index $values \"C\" }}% (>80%) for 30m. Read-only signal (overage never gates spawning, per the design's explicit non-goal) - informational for the human plan owner to decide whether to raise the limit or curb discretionary agent kinds manually."
    labels:
      homelab: "true"
      system: "tatara"
      component: "operator"
      severity: "warning"
