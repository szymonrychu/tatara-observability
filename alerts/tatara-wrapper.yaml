---
# tatara-claude-code-wrapper (component=wrapper) alert rules.
#
# The wrapper runs as EPHEMERAL agent job pods spawned by the operator
# (container="wrapper", pods named tatara-<project>-<gh|gl>-<repo>-<issue|mr>-<n>
# and tatara-<project>-<gh|gl>-brainstorm). It has NO long-lived Deployment and
# NO /metrics scrape target: it pushes its ccw_*/tatara_wrapper_* series through
# the operator's remote-write pushgateway. Therefore:
#   * the workload-generic block pins on container="wrapper" in kube-state-metrics
#     (there is no up{} series for the wrapper to do a "target down" rule on).
#   * the ccw_*/tatara_wrapper_* rules below are LIVE: pushMetricsAllowedPrefixes was
#     widened (operator 12729ed) so the operator push allowlist now forwards those
#     families. default_no_data_state: "OK" keeps a rule green when its series is
#     genuinely absent (e.g. no agent pods running), not firing.
interval_seconds: 60
default_no_data_state: "OK"
rules:
  # ---- workload-generic (pinned to the wrapper agent container) ----
  - name: "Wrapper agent container crash-looping"
    queries:
      - expression: |
          max(increase(kube_pod_container_status_restarts_total{namespace="tatara",container="wrapper"}[15m]))
    math_operator: ">"
    threshold: 3
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-agent-container-crash-looping"
      summary: "Wrapper agent container restarted {{ index $values \"C\" }} times in 15m in namespace {{ index $labels \"namespace\" }}. Agent pods are crash-looping."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "warning"
  - name: "Wrapper agent container OOMKilled"
    queries:
      - expression: |
          sum(kube_pod_container_status_last_terminated_reason{namespace="tatara",container="wrapper",reason="OOMKilled"})
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-agent-container-oomkilled"
      summary: "{{ index $values \"C\" }} wrapper agent container(s) last terminated OOMKilled in namespace {{ index $labels \"namespace\" }}. Raise the agent memory limit."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "warning"
  - name: "Wrapper agent container stuck waiting"
    queries:
      - expression: |
          sum(kube_pod_container_status_waiting_reason{namespace="tatara",container="wrapper",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerError|CreateContainerConfigError"})
    math_operator: ">"
    threshold: 0
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-agent-container-stuck-waiting"
      summary: "{{ index $values \"C\" }} wrapper agent container(s) stuck waiting (image-pull or create-container error) in namespace {{ index $labels \"namespace\" }}. Agents cannot start."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "critical"
  - name: "Wrapper agent pods not becoming ready"
    queries:
      - expression: |
          sum(kube_pod_status_ready{namespace="tatara",condition="false"} * on(pod,namespace) group_left() max(kube_pod_container_status_waiting_reason{namespace="tatara",container="wrapper"}) by (pod,namespace))
    math_operator: ">"
    threshold: 2
    for: 30m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-agent-pods-not-becoming-ready"
      summary: "{{ index $values \"C\" }} wrapper agent pod(s) not Ready for 30m in namespace {{ index $labels \"namespace\" }}. Agent throughput degraded."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "warning"
  # ---- wrapper-specific (ccw_*/tatara_wrapper_* via operator push; LIVE since operator 12729ed) ----
  - name: "Wrapper commit/push failure ratio high"
    queries:
      - expression: |
          sum(rate(ccw_commit_push_total{result="fail"}[30m])) / clamp_min(sum(rate(ccw_commit_push_total[30m])), 0.0001)
    math_operator: ">"
    threshold: 0.2
    for: 30m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-commit-push-failure-ratio-high"
      summary: "Wrapper commit/push failing {{ index $values \"C\" }} of pushes over 30m (>20%). Agent work is not landing on the source repos."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "warning"
  - name: "Wrapper turns erroring"
    queries:
      - expression: |
          sum(rate(ccw_turns_total{result="failed"}[30m])) / clamp_min(sum(rate(ccw_turns_total[30m])), 0.0001)
    math_operator: ">"
    threshold: 0.3
    for: 30m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-turns-erroring"
      summary: "Wrapper turns failing {{ index $values \"C\" }} of turns over 30m (>30%). Claude sessions are erroring out."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "warning"
  - name: "Wrapper HTTP 5xx responses"
    queries:
      - expression: |
          sum(rate(ccw_http_requests_total{status_code=~"5..", route!~"/readyz|/healthz|/metrics"}[10m]))
    math_operator: ">"
    threshold: 0
    for: 10m
    decimal_points: 2
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-http-5xx-responses"
      summary: "Wrapper HTTP API returning 5xx (excludes /readyz|/healthz|/metrics probes) at {{ index $values \"C\" }}/s over 10m. A real wrapper API request path is erroring."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "warning"
  - name: "Wrapper HTTP handler panics"
    queries:
      - expression: |
          sum(increase(ccw_http_panics_total[15m]))
    math_operator: ">"
    threshold: 0
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-http-handler-panics"
      summary: "Wrapper recovered {{ index $values \"C\" }} HTTP handler panic(s) in 15m. A request path is panicking."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "critical"
  - name: "Wrapper Claude process crash-looping"
    # ccw_claude_restarts_total counts restarts of the Claude subprocess INSIDE a
    # wrapper pod - distinct from the kube container crash-loop rule above, which
    # keys on kube_pod_container_status_restarts_total{container="wrapper"} and only
    # increments when the wrapper CONTAINER restarts. A looping Claude subprocess
    # with the wrapper staying up burns budget and stalls the Task without tripping
    # that rule. Group by exported_pod (the ephemeral agent pod): on the pushed
    # series `pod` is the operator re-exporter pod, so by(pod) would fan every agent
    # run on one operator replica into a single bucket. for:5m (not 15m) so it fires
    # before the ephemeral agent pod's pushed series is TTL-evicted (matches the
    # ccw_http_panics_total precedent).
    queries:
      - expression: |
          sum by (exported_pod) (increase(ccw_claude_restarts_total[15m]))
    math_operator: ">"
    threshold: 3
    for: 5m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-claude-process-crash-looping"
      summary: "Claude subprocess restarted {{ index $values \"C\" }} times in 15m inside wrapper agent pod {{ index $labels \"exported_pod\" }}. The in-pod agent session is crash-looping (burning budget, stalling the Task)."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "warning"
  # THE IN-POD HALF OF THE STALL PROBE, AND IT IS A DIAGNOSIS RATHER THAN A TIMEOUT.
  # ccw_probe_outcomes_total{outcome} (tatara-claude-code-wrapper #156,
  # internal/metrics/metrics.go:183) takes exactly three values, from the consts at
  # internal/transcript/probe.go:47-51: answered|delivered_unanswered|never_delivered.
  # Only never_delivered is selected here, and it means something specific and
  # positive - it is NOT "we heard nothing":
  #
  #   The probe is written onto the PTY and the claude session logs a `queue-operation`
  #   ENQUEUE line for it immediately, before anything reaches the model. Delivery happens
  #   at the NEXT TOOL-CALL BOUNDARY, at which point a matching remove/dequeue line is
  #   written. never_delivered is enqueue-with-no-remove: the session took the text and
  #   then never reached another tool-call boundary. The agent is BLOCKED INSIDE ONE
  #   SINGLE LONG-RUNNING TOOL CALL. Measured: a 70s sleep buffered a probe 58.2s and it
  #   was then delivered normally; a tool call that never returns is never delivered at all.
  #
  # delivered_unanswered is deliberately NOT selected here. It is the weak signal (the
  # model saw the probe and did not reply, which a busy turn does legitimately) and the
  # operator-side rule "Operator agent stall probe unanswered" already carries it, keyed
  # by outcome, with the fleet-wide view. Alerting on it from both sides would double-page
  # one event.
  #
  # NO SERIES YET AS OF 2026-08-09, and that is expected, not broken. The outcome counter
  # is written only TERMINALLY - on answer, on supersede by a later probe, or at shutdown
  # via probes.Finalize() - so a fleet in which no probe has ever finished has never
  # incremented any of the three. ccw_probe_answer_seconds_count IS present in Prometheus
  # (an unlabelled histogram exists at registration), which is how we know the probe build
  # is actually deployed rather than the family being dark. default_no_data_state: "OK"
  # keeps this green until the first probe completes.
  - name: "Wrapper agent blocked inside a tool call"
    queries:
      - expression: |
          sum(increase(ccw_probe_outcomes_total{outcome="never_delivered"}[1h]))
    math_operator: ">"
    threshold: 3
    for: 15m
    decimal_points: 0
    annotations:
      runbook_url: "https://szymonrychu.github.io/tatara-documentation/operations/runbooks/#tatara-runbook-wrapper-agent-blocked-inside-a-tool-call"
      summary: "{{ index $values \"C\" }} stall probe(s) never delivered in 1h (>3). This is a DIAGNOSIS, not a timeout: the probe's queue-operation enqueue line was written and no matching remove followed, so the agent never reached another tool-call boundary and is blocked inside ONE long-running tool call - an MCP or forge call with no client-side timeout, a git/package command waiting on a prompt nobody answers, a shell read from an empty stdin, or a genuinely enormous build. The wrapper is healthy, the session and its context are intact, and killing the pod is the wrong move: `kubectl -n tatara exec <pod> -c wrapper -- ps -eo pid,etimes,args --sort=-etimes | head` names the culprit, because the longest-running child of the claude process IS the tool call that has not returned. If ps shows no long-running child at all, the transcript tailer is missing the remove line - that is a wrapper bug, escalate it."
    labels:
      homelab: "true"
      system: "tatara"
      component: "wrapper"
      severity: "warning"
  # ccw_turn_stall_suspected_total HAS NO RULE HERE, DELIBERATELY, AND THIS COMMENT IS THE
  # REASON. Phase B1 was specified to alert on it, but the counter does not exist at
  # tatara-claude-code-wrapper origin/main (e662ed5): it is added by the UNMERGED phase-W4
  # branch feat/w4-interrupt-and-stall-suspect, where the inactivity timer stops failing
  # turns and calls markStallSuspected instead. On main, session.go leaves the companion
  # Snapshot field stallSuspectedSince "intentionally left zero" and subagents_test.go
  # asserts "nothing marks a stall in this phase".
  #
  # Writing the rule now would not merely be premature, it would FAIL CI in two places and
  # for the right reasons: check_metric_provenance.py rejects an alert on a metric absent
  # from scripts/metrics_allowlist.txt, and adding it to the allowlist to satisfy that would
  # then fail reconcile_metric_provenance.py, which diffs the allowlist against the producer
  # repos' live source. Both guards exist precisely to stop a rule shipping against a metric
  # nobody emits, since default_no_data_state: "OK" would make it report green forever.
  # Add it in the same change that ships W4 (the counter is unlabelled -
  # prometheus.NewCounter, metrics.go:203 on that branch - so the rule is a bare
  # sum(increase(ccw_turn_stall_suspected_total[1h]))), not before.
  # The "Wrapper token spend runaway" rule was MOVED to alerts/tatara-operator.yaml
  # 2026-07-04 as "Agent token spend runaway ($/s)": it read the dead/ephemeral
  # ccw_turn_tokens_total push family and thresholded on a flat token/s number;
  # re-baselined onto the durable operator_task_tokens_total{model,type} metric
  # priced per-model in $/s (review gap G17 / G2 durable-measurement design).
  # The "Wrapper metrics dropped by operator push allowlist" canary was REMOVED
  # 2026-06-25: its purpose (signal that ccw_*/tatara_wrapper_* were dark) is done -
  # pushMetricsAllowedPrefixes was widened (operator 12729ed). The residual
  # reserved_name drops are the wrapper push-forwarding go_*/process_* runtime
  # metrics it should not (wrapper bug, tracked separately), so the canary only
  # false-fired. operator_push_series_dropped_total has no per-prefix label to scope
  # it, so do not re-add it as-is; add a targeted rule only if a specific ccw_*
  # family is observed dark again.
